<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spændingsfeltet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: projektor-scoreboard øverst, 5x5 Jeopardy-bræt, spørgsmål i fuldskærms-overlay. Én bevidst mørk "tavle i laboratoriet"-look. */
:root{
  --ink:#0d1330;          /* baggrund */
  --board:#1a2466;        /* felter */
  --board-hi:#26338a;
  --line:#3a4699;
  --gold:#ffc83d;         /* pointværdier */
  --text:#eef0ff;
  --muted:#a9b0e0;
  --girls:#ff6b5b;        /* Pigerne */
  --boys:#3fc6ff;         /* Drengene */
  --good:#4be08a;
  --bad:#ff4d6d;
  --hard:#c58cff;         /* kvit eller dobbelt */
  --f-display:"Bungee","Impact","Arial Black",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:16px;
  background-image:radial-gradient(circle at 15% -10%,rgba(63,198,255,.12),transparent 45%),radial-gradient(circle at 90% 110%,rgba(255,107,91,.10),transparent 45%);}
.wrap{max-width:1280px;margin:0 auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* Top */
header{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch}
.team{border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:6px;border:2px solid transparent;background:rgba(255,255,255,.04);transition:border-color .3s,box-shadow .3s,transform .3s}
.team.girls{--c:var(--girls)} .team.boys{--c:var(--boys);text-align:right;align-items:flex-end}
.team.active{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent),0 0 30px color-mix(in srgb,var(--c) 30%,transparent)}
.team-name{font-family:var(--f-display);font-size:clamp(16px,2.2vw,26px);color:var(--c);background:none;border:0;padding:0;text-align:inherit}
.team-score{font-family:var(--f-display);font-size:clamp(34px,5.5vw,64px);line-height:1;font-variant-numeric:tabular-nums}
.team-score.bump{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.25)}}
.turn{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-height:1.2em}
.team.active .turn{color:var(--c)}
.adj{display:flex;gap:6px}
.adj button{background:transparent;border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12px;color:var(--muted)}
.adj button:hover{color:var(--text);border-color:var(--muted)}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(20px,3vw,36px);color:var(--gold);letter-spacing:.02em;text-wrap:balance}
h1 .bolt{display:inline-block;width:.7em;vertical-align:-.05em}
.sub{color:var(--muted);font-size:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tools button{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
.tools button:hover{background:rgba(255,255,255,.12)}

/* Bræt */
.board-scroll{overflow-x:auto}
.board{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:8px;min-width:640px}
.cat{background:var(--board);border-radius:10px;padding:12px 8px;min-height:72px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--f-display);font-size:clamp(12px,1.35vw,17px);line-height:1.2;color:var(--text);border-bottom:4px solid var(--gold);text-wrap:balance}
.tile{position:relative;background:linear-gradient(180deg,var(--board-hi),var(--board));border:0;border-radius:10px;height:clamp(64px,10vh,104px);font-family:var(--f-display);font-size:clamp(24px,3.4vw,44px);color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .15s,filter .15s}
.tile:hover:not(:disabled){transform:translateY(-3px) scale(1.03);filter:brightness(1.2)}
.tile:disabled{cursor:default;background:rgba(255,255,255,.03);color:transparent;text-shadow:none}
.tile .who{position:absolute;inset:auto 0 10px;font-family:var(--f-body);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tile.hard{color:var(--hard);animation:pulse 1.6s infinite}
.tile.hard::after{content:"×2?";position:absolute;top:6px;right:8px;font-size:12px;font-family:var(--f-body);font-weight:700;color:var(--hard)}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--hard),0 0 24px color-mix(in srgb,var(--hard) 50%,transparent)}}
.status{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:14px}
.status b{color:var(--text)}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(6,9,26,.88);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.card{position:relative;width:min(960px,100%);max-height:100%;overflow:auto;background:var(--board);border-radius:18px;padding:clamp(20px,4vw,44px);border:2px solid var(--line);display:flex;flex-direction:column;gap:20px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.card.hardmode{border-color:var(--hard);box-shadow:0 0 50px color-mix(in srgb,var(--hard) 35%,transparent)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meta .pts{font-family:var(--f-display);color:var(--gold);font-size:20px;letter-spacing:0}
.meta .ans{color:var(--c)}
.q{margin:0;font-size:clamp(22px,3.2vw,40px);line-height:1.25;font-weight:700;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:rgba(255,255,255,.07);border:2px solid var(--line);border-radius:12px;padding:14px 16px;font-size:clamp(16px,1.9vw,22px);transition:background .15s,border-color .15s,transform .15s;min-width:0}
.opt:hover:not(:disabled){background:rgba(255,255,255,.14);border-color:var(--gold)}
.opt .l{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--ink);font-family:var(--f-display);font-size:16px}
.opt:disabled{cursor:default}
.opt.right{background:color-mix(in srgb,var(--good) 25%,transparent);border-color:var(--good)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 25%,transparent);border-color:var(--bad)}
.opt.fade{opacity:.35}
.explain{font-size:clamp(15px,1.7vw,19px);color:var(--muted);line-height:1.45;margin:0}
.explain b{color:var(--text)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.btn{background:var(--gold);color:var(--ink);border:0;border-radius:999px;padding:12px 24px;font-family:var(--f-display);font-size:16px}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line);font-family:var(--f-body);font-weight:700}
.btn:hover{filter:brightness(1.1)}

/* Kvit eller dobbelt */
.kd-title{font-family:var(--f-display);color:var(--hard);font-size:clamp(28px,5vw,56px);margin:0;line-height:1.05;text-wrap:balance}
.kd{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kd button{border-radius:16px;padding:20px;border:3px solid var(--line);background:rgba(255,255,255,.05);text-align:left;display:flex;flex-direction:column;gap:8px}
.kd button:hover{transform:translateY(-3px)}
.kd .big{font-family:var(--f-display);font-size:clamp(24px,3.6vw,40px)}
.kd .kvit .big{color:var(--text)} .kd .dobbelt{border-color:var(--hard)} .kd .dobbelt .big{color:var(--hard)}
.kd small{font-size:16px;color:var(--muted);line-height:1.4}

/* Resultat-stempel */
.stamp{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-8deg);font-family:var(--f-display);font-size:clamp(48px,11vw,130px);pointer-events:none;white-space:nowrap;display:flex;align-items:center;gap:.15em;z-index:3}
.stamp.good{color:var(--good);text-shadow:0 0 30px color-mix(in srgb,var(--good) 70%,transparent),0 6px 0 rgba(0,0,0,.4);animation:stampIn .5s cubic-bezier(.2,1.6,.4,1) both,stampOut .4s 1.5s forwards}
.stamp.bad{color:var(--bad);text-shadow:0 0 30px color-mix(in srgb,var(--bad) 70%,transparent),0 6px 0 rgba(0,0,0,.4);animation:stampIn .5s cubic-bezier(.2,1.6,.4,1) both,flicker .6s .5s,stampOut .4s 1.5s forwards}
.stamp svg{width:.8em;height:.8em}
@keyframes stampIn{from{transform:translate(-50%,-50%) rotate(-8deg) scale(3);opacity:0}}
@keyframes stampOut{to{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(.8)}}
@keyframes flicker{20%,60%{opacity:.2}40%,80%{opacity:1}}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-14px) rotate(-1deg)}40%{transform:translateX(12px) rotate(1deg)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:20;animation:flash .6s forwards}
.flash.good{background:radial-gradient(circle,rgba(75,224,138,.35),transparent 70%)}
.flash.bad{background:radial-gradient(circle,rgba(255,77,109,.45),transparent 70%)}
@keyframes flash{to{opacity:0}}
.delta{font-family:var(--f-display);font-size:28px}
.delta.plus{color:var(--good)} .delta.minus{color:var(--bad)} .delta.zero{color:var(--muted)}

canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

/* Slut */
.winner{font-family:var(--f-display);font-size:clamp(36px,7vw,84px);margin:0;line-height:1;text-wrap:balance}
.final{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;font-family:var(--f-display);font-size:clamp(22px,3.5vw,40px)}

@media (max-width:640px){
  header{grid-template-columns:1fr 1fr}
  .mid{grid-column:1/-1;order:-1}
  .opts,.kd{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="team girls" id="team-p">
      <button class="team-name" data-turn="p" title="Giv turen til Pigerne">Pigerne</button>
      <div class="team-score" id="score-p">0</div>
      <div class="turn" id="turn-p"></div>
      <div class="adj"><button data-adj="p,-100" aria-label="Træk 100 fra Pigerne">−100</button><button data-adj="p,100" aria-label="Giv Pigerne 100">+100</button></div>
    </div>
    <div class="mid">
      <h1><svg class="bolt" viewBox="0 0 24 32" aria-hidden="true"><path d="M14 0 2 18h8l-2 14 14-20h-9z" fill="currentColor"/></svg> Spændingsfeltet</h1>
      <div class="sub">Statisk elektricitet &amp; elektromagnetisme · 7. klasse</div>
      <div class="tools">
        <button id="sound">Lyd: til</button>
        <button id="reset">Nyt spil</button>
      </div>
    </div>
    <div class="team boys" id="team-d">
      <button class="team-name" data-turn="d" title="Giv turen til Drengene">Drengene</button>
      <div class="team-score" id="score-d">0</div>
      <div class="turn" id="turn-d"></div>
      <div class="adj"><button data-adj="d,-100" aria-label="Træk 100 fra Drengene">−100</button><button data-adj="d,100" aria-label="Giv Drengene 100">+100</button></div>
    </div>
  </header>

  <div class="board-scroll"><div class="board" id="board"></div></div>
  <div class="status"><span id="left"></span><span>Klik på et holdnavn for at give det turen. ±100 retter pointene.</span></div>
</div>

<div class="overlay" id="overlay" hidden><div class="card" id="card"></div></div>
<canvas id="fx"></canvas>

<script>
const CATS=[
 {name:"Statisk elektricitet",q:[
  ["Hvad sker der, når to ting med samme ladning kommer tæt på hinanden?",["De frastøder hinanden","De tiltrækker hinanden","Der sker ingenting","De bliver varme"],"Ens ladninger frastøder hinanden – forskellige ladninger tiltrækker."],
  ["Hvorfor står håret ofte op, når du tager en uldhue af?",["Hårene får samme ladning og frastøder hinanden","Hårene bliver magnetiske","Huen suger luft ud af håret","Hårene bliver tungere"],"Når huen gnider mod håret, får alle hårene samme ladning, og så skubber de væk fra hinanden."],
  ["Du gnider en ballon mod dit hår. Hvad er det, der flytter sig?",["Elektroner","Protoner","Neutroner","Atomkerner"],"Kun elektronerne kan flytte sig. Protoner og neutroner sidder fast i atomkernen."],
  ["Et lyn er et eksempel på …",["En kæmpe elektrisk afladning","En magnet i skyen","Brændende regndråber","Lys fra solen, der bliver kastet tilbage"],"Skyen bliver kraftigt ladet, og ladningen udlignes i én stor gnist – lynet."],
  ["Hvorfor kan en opladet ballon hænge fast på en væg, der ikke er ladet?",["Ballonen skubber ladningerne i væggen, så modsat ladning kommer tæt på","Væggen er altid positiv","Ballonen bliver klistret af gnidningen","Luften presser ballonen ind mod væggen"],"Ballonens ladning flytter lidt rundt på ladningerne i væggen. Den modsatte ladning ender tættest på ballonen, og så tiltrækker de hinanden."]
 ],hard:[
  ["Hvorfor får man oftere stød fra et dørhåndtag om vinteren?",["Luften er tør, så ladningen ikke langsomt kan slippe væk","Det er koldt, så metallet leder bedre","Vi har flere lag tøj på, der isolerer","Der er mindre strøm i husene om vinteren"],"Fugt i luften lader ladningen sive væk. Tør vinterluft betyder, at du samler ladning op – og så kommer den i ét stød."],
  ["En ballon gnides mod en uldtrøje og bliver negativt ladet. Hvad sker der med trøjen?",["Den bliver positivt ladet","Den bliver også negativt ladet","Den forbliver neutral","Den bliver magnetisk"],"Elektronerne er flyttet fra trøjen til ballonen. Trøjen mangler nu elektroner og er derfor positiv."],
  ["Hvorfor er man ret sikker inde i en bil i tordenvejr?",["Metalkarosseriet leder strømmen udenom de personer, der sidder i bilen","Gummidækkene isolerer","Lynet kan ikke ramme ting, der kører","Bilens batteri trækker lynet væk"],"Metallet omkring dig leder strømmen udenom (et Faradays bur). Dækkene er ikke grunden."],
  ["Hvorfor slår lynet tit ned i høje, spidse ting som tårne og træer?",["De giver afladningen en kortere vej til jorden","De er altid lavet af metal","De er varmere end omgivelserne","Lyn tiltrækkes af blade og sten"],"Høje, spidse ting kommer tættere på skyen, og ladningen samler sig i spidser. Derfor sidder lynafledere øverst på bygninger."]
 ]},
 {name:"Atomer og ladninger",q:[
  ["Hvilken ladning har en elektron?",["Negativ","Positiv","Ingen ladning","Det skifter"],"Elektroner er negative, protoner er positive, og neutroner har ingen ladning."],
  ["Hvor i atomet finder du protonerne?",["I kernen","I elektronskyen yderst","Mellem atomerne","Uden for atomet"],"Protoner og neutroner sidder i atomkernen. Elektronerne bevæger sig rundt om kernen."],
  ["Et atom har lige mange protoner og elektroner. Atomet er derfor …",["Neutralt","Positivt","Negativt","Magnetisk"],"Plusserne og minusserne udligner hinanden, så atomet har ingen samlet ladning."],
  ["Hvad sker der med et atom, der mister en elektron?",["Det bliver positivt ladet","Det bliver negativt ladet","Det bliver til et andet grundstof","Det forsvinder"],"Når en minus forsvinder, er der flere plusser tilbage. Atomet bliver en positiv ion."],
  ["Hvilke partikler i atomet har ingen ladning?",["Neutroner","Protoner","Elektroner","Ioner"],"Neutroner er neutrale – det ligger i navnet."]
 ],hard:[
  ["Et atom har 11 protoner og 10 elektroner. Hvad er dets samlede ladning?",["+1","−1","0","+21"],"11 plusser og 10 minusser giver én plus i overskud: +1. Det er en natrium-ion."],
  ["Hvorfor er det elektronerne og ikke protonerne, der flytter sig, når man gnider to ting mod hinanden?",["Elektronerne sidder yderst og kan rives løs","Protonerne er for små","Elektronerne er tungere","Protonerne har ingen ladning"],"Protonerne er bundet i kernen. Elektronerne sidder yderst og er de eneste, der kan skifte mellem materialer."],
  ["Hvad bestemmer, hvilket grundstof et atom er?",["Antallet af protoner","Antallet af elektroner","Antallet af neutroner","Atomets størrelse"],"Protontallet er grundstoffets ID. 6 protoner er altid kulstof, 8 er altid ilt."],
  ["Hvad kaldes et atom, der har fået ekstra elektroner?",["En negativ ion","En positiv ion","Et molekyle","En isotop"],"Ekstra elektroner giver flere minusser end plusser – en negativ ion."]
 ]},
 {name:"Magneter",q:[
  ["Hvad hedder en magnets to ender?",["Nordpol og sydpol","Plus og minus","Top og bund","Øst og vest"],"Alle magneter har en nordpol og en sydpol. Ens poler frastøder, forskellige tiltrækker."],
  ["Hvilket metal tiltrækkes af en magnet?",["Jern","Kobber","Aluminium","Guld"],"Jern (og nikkel og kobolt) er magnetiske. Kobber, aluminium og guld er ikke."],
  ["Hvad sker der, hvis du knækker en stangmagnet over i to?",["Du får to magneter med hver sin nord- og sydpol","Du får en nordpol og en sydpol hver for sig","Magnetismen forsvinder","Den ene halvdel bliver magnetisk"],"Hvert stykke får sin egen nordpol og sydpol. Man kan ikke få en pol alene."],
  ["Hvorfor peger en kompasnål mod nord?",["Jorden er en stor magnet, og nålen retter sig efter dens magnetfelt","Nålen tiltrækkes af den kolde luft mod nord","Kompasset er indstillet fra fabrikken","Månen trækker i nålen"],"Kompasnålen er en lille magnet, der retter sig ind efter jordens magnetfelt."],
  ["Hvordan kan du gøre magnetfeltet omkring en magnet synligt?",["Drys jernfilspåner omkring den","Lys på den med en lommelygte","Læg den i vand","Gnid den med uld"],"Jernfilspånerne lægger sig langs feltlinjerne, så man kan se mønsteret."]
 ],hard:[
  ["Hvor er magnetfeltet omkring en stangmagnet stærkest?",["Ved polerne","På midten","Lige meget overalt","Langt væk fra magneten"],"Feltlinjerne samles ved polerne. Derfor hænger flest jernfilspåner ved enderne."],
  ["Jordens geografiske nordpol er magnetisk set en …",["Sydpol","Nordpol","Den er ikke magnetisk","Plus-pol"],"Kompassets nordpol peger mod nord. Da forskellige poler tiltrækker, må der ligge en magnetisk sydpol mod nord."],
  ["Hvad sker der, hvis du opvarmer en magnet meget kraftigt?",["Den mister sin magnetisme","Den bliver stærkere","Polerne bytter plads","Den begynder at tiltrække kobber"],"Varme får de små magnetiske områder i metallet til at rode rundt, så de ikke længere peger samme vej."],
  ["Hvorfor kan en magnet ikke samle en tom sodavandsdåse op?",["Dåsen er af aluminium, som ikke er magnetisk","Dåsen er for let","Dåsen er positivt ladet","Lakken på dåsen isolerer"],"De fleste sodavandsdåser er af aluminium. Konservesdåser af stål kan derimod godt samles op."]
 ]},
 {name:"Elektro­magnetisme",q:[
  ["Hvad får du, når du vikler en ledning om et jernsøm og sender strøm igennem?",["En elektromagnet","Et batteri","En pære","En kondensator"],"Strømmen i spolen laver et magnetfelt, og jernsømmet forstærker det."],
  ["Hvad sker der med en elektromagnet, når du slukker for strømmen?",["Den mister sin magnetisme","Den bliver stærkere","Den bliver varm og smelter","Den bliver permanent magnetisk"],"Det smarte ved en elektromagnet er, at man kan tænde og slukke den."],
  ["Hvilken dansker opdagede i 1820, at strøm i en ledning kan få en kompasnål til at dreje?",["H.C. Ørsted","H.C. Andersen","Niels Bohr","Tycho Brahe"],"H.C. Ørsted opdagede sammenhængen mellem strøm og magnetisme i København."],
  ["Hvordan kan du gøre en elektromagnet stærkere?",["Vikle flere vindinger om jernkernen","Bruge en plastikkerne","Bruge en tyndere ledning af plastik","Slukke for strømmen"],"Flere vindinger eller mere strøm giver et stærkere magnetfelt."],
  ["Du bevæger en magnet ind og ud af en spole, der er koblet til en lille pære. Hvad sker der?",["Der dannes strøm, så pæren kan lyse","Magneten bliver varm","Spolen bliver til et kompas","Ingenting – der er intet batteri"],"En magnet i bevægelse laver strøm i spolen. Det hedder induktion."]
 ],hard:[
  ["Hvad sker der med en elektromagnets poler, hvis du vender strømmens retning?",["Nordpol og sydpol bytter plads","Den holder op med at virke","Den bliver dobbelt så stærk","Ingenting"],"Strømmens retning bestemmer, hvilken ende der bliver nordpol."],
  ["Hvorfor sætter man en jernkerne ind i spolen på en elektromagnet?",["Jernet forstærker magnetfeltet","Jernet leder strømmen hurtigere","Jernet holder spolen kold","Jernet gør spolen lettere"],"Jernet bliver selv magnetisk og forstærker spolens felt mange gange."],
  ["Hvilken hverdagsting bruger en elektromagnet og en membran til at lave lyd?",["En højttaler","En glødepære","En lommeregner","Et termometer"],"Strømmen får elektromagneten til at skubbe og trække i en membran, der sætter luften i svingninger."],
  ["Hvad kaldes det, når en magnet i bevægelse skaber strøm i en spole?",["Induktion","Isolation","Fission","Statisk elektricitet"],"Induktion bruges i generatorer, cykeldynamoer og trådløse opladere."]
 ]},
 {name:"Strøm i hverdagen",q:[
  ["Hvilket materiale leder strøm godt?",["Kobber","Plastik","Gummi","Træ"],"Metaller som kobber leder strøm godt. Derfor er ledninger lavet af kobber."],
  ["Hvad kaldes et materiale, der ikke leder strøm?",["En isolator","En leder","En magnet","En generator"],"Plastik, gummi, glas og tørt træ er isolatorer."],
  ["Hvorfor er ledninger dækket af plastik?",["Plastikken isolerer, så man ikke får stød","Plastikken gør strømmen hurtigere","Det er kun for farvens skyld","Plastik leder strømmen bedre end kobber"],"Plastikken holder strømmen inde i kobberet og beskytter dig."],
  ["Hvad skal der til, for at en pære lyser?",["Et lukket kredsløb med en strømkilde","Kun en ledning","Et åbent kredsløb","En magnet ved siden af pæren"],"Strømmen skal kunne løbe hele vejen rundt fra batteri, gennem pæren og tilbage."],
  ["Hvilken maskine i en vindmølle laver strøm ved hjælp af magneter og spoler?",["En generator","En motor","En transformer","Et batteri"],"Vingerne drejer generatoren, hvor magneter og spoler laver strøm ved induktion."]
 ],hard:[
  ["To pærer sidder i serie. Den ene går i stykker. Hvad sker der?",["Begge pærer går ud","Den anden lyser stærkere","Den anden lyser videre som før","Batteriet eksploderer"],"I en serieforbindelse er der kun én vej for strømmen. Brydes den, stopper alt."],
  ["Hvad er enheden for elektrisk spænding?",["Volt","Ampere","Watt","Ohm"],"Spænding måles i volt (V). Et almindeligt batteri har 1,5 V."],
  ["En elmotor omdanner elektrisk energi til …",["Bevægelsesenergi","Kemisk energi","Lysenergi","Kerneenergi"],"En elmotor bruger elektromagnetisme til at få noget til at dreje rundt. En generator gør det modsatte."],
  ["Hvorfor er det farligt at bruge en hårtørrer i badekarret?",["Vandet leder strømmen, så den kan gå gennem kroppen","Vandet gør hårtørreren magnetisk","Damp gør strømmen stærkere","Hårtørreren bliver statisk ladet"],"Vand med opløste stoffer leder strøm. Strømmen kan gå gennem dig i stedet for gennem ledningen."]
 ]}
];
const VALUES=[100,200,300,400,500];
const NAMES={p:"Pigerne",d:"Drengene"};
const HARD_AT=5;

let S;
function fresh(){return{scores:{p:0,d:0},turn:"p",done:{},hardUsed:CATS.map(()=>[]),announced:false,sound:true}}
function load(){try{const r=localStorage.getItem("spaendingsfeltet");if(r)return JSON.parse(r)}catch(e){}return null}
function save(){try{localStorage.setItem("spaendingsfeltet",JSON.stringify(S))}catch(e){}}
const left=()=>25-Object.keys(S.done).length;
const hardPhase=()=>left()<=HARD_AT;

const $=id=>document.getElementById(id);
function render(){
  const b=$("board");b.innerHTML="";
  CATS.forEach(c=>{const d=document.createElement("div");d.className="cat";d.textContent=c.name;b.appendChild(d)});
  VALUES.forEach((v,r)=>CATS.forEach((c,ci)=>{
    const k=ci+"-"+r,t=document.createElement("button");t.className="tile";
    const done=S.done[k];
    if(done){t.disabled=true;t.setAttribute("aria-label",c.name+" "+v+" – brugt");
      if(done.who){const w=document.createElement("span");w.className="who";w.style.color=done.who==="p"?"var(--girls)":"var(--boys)";w.textContent=(done.pts>0?"+":"")+done.pts+" "+NAMES[done.who];t.appendChild(w)}}
    else{t.textContent=v;if(hardPhase())t.classList.add("hard");t.onclick=()=>openTile(ci,r);t.setAttribute("aria-label",c.name+" for "+v)}
    b.appendChild(t)}));
  for(const k of ["p","d"]){
    $("score-"+k).textContent=S.scores[k];
    $("team-"+k).classList.toggle("active",S.turn===k);
    $("turn-"+k).textContent=S.turn===k?"Har turen":"";
  }
  $("left").innerHTML=hardPhase()?`<b>${left()}</b> spørgsmål tilbage · <b style="color:var(--hard)">Kvit eller dobbelt</b>`:`<b>${left()}</b> spørgsmål tilbage · Kvit eller dobbelt starter ved ${HARD_AT}`;
  $("sound").textContent="Lyd: "+(S.sound?"til":"fra");
  save();
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function pickHard(ci){
  const pool=CATS[ci].hard;let free=pool.map((_,i)=>i).filter(i=>!S.hardUsed[ci].includes(i));
  if(free.length){const i=free[Math.random()*free.length|0];S.hardUsed[ci].push(i);return pool[i]}
  for(let o=0;o<CATS.length;o++){const f=CATS[o].hard.map((_,i)=>i).filter(i=>!S.hardUsed[o].includes(i));if(f.length){S.hardUsed[o].push(f[0]);return CATS[o].hard[f[0]]}}
  return CATS[ci].q[4];
}

const ov=$("overlay"),card=$("card");
function show(html,hard){card.className="card"+(hard?" hardmode":"");card.innerHTML=html;ov.hidden=false;const f=card.querySelector("button");if(f)f.focus()}
function hide(){ov.hidden=true}

function openTile(ci,r){
  const v=VALUES[r],hard=hardPhase();
  if(!hard){askQuestion(ci,r,CATS[ci].q[r],v,"normal");return}
  const q=pickHard(ci);
  const c=S.turn==="p"?"var(--girls)":"var(--boys)";
  show(`<div class="meta"><span>${CATS[ci].name}</span><span class="ans" style="--c:${c}">${NAMES[S.turn]} vælger</span></div>
   <p class="kd-title">Kvit eller dobbelt?</p>
   <p class="explain">Dette er et af de sidste ${HARD_AT} spørgsmål, og det er sværere. Spørgsmålet er værd <b>${v} point</b>.</p>
   <div class="kd">
    <button class="kvit" id="kvit"><span class="big">Kvit</span><small>Rigtigt svar: +${v}<br>Forkert svar: 0</small></button>
    <button class="dobbelt" id="dobbelt"><span class="big">Dobbelt</span><small>Rigtigt svar: +${v*2}<br>Forkert svar: −${v}</small></button>
   </div>`,true);
  $("kvit").onclick=()=>{blip(440);askQuestion(ci,r,q,v,"kvit")};
  $("dobbelt").onclick=()=>{blip(660);askQuestion(ci,r,q,v,"dobbelt")};
}

function askQuestion(ci,r,q,v,mode){
  const team=S.turn,c=team==="p"?"var(--girls)":"var(--boys)";
  const opts=shuffle(q[1].map((t,i)=>({t,ok:i===0})));
  const win=mode==="dobbelt"?v*2:v,lose=mode==="dobbelt"?-v:0;
  const label=mode==="dobbelt"?`${win} point · dobbelt`:mode==="kvit"?`${v} point · kvit`:`${v} point`;
  show(`<div class="meta"><span>${CATS[ci].name}</span><span class="pts">${label}</span><span class="ans" style="--c:${c}">${NAMES[team]} svarer</span></div>
   <p class="q">${q[0]}</p>
   <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="l">${"ABCD"[i]}</span><span>${o.t}</span></button>`).join("")}</div>
   <div id="after"></div>`,mode!=="normal");
  card.querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{
    const i=+btn.dataset.i,ok=opts[i].ok;
    card.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(opts[j].ok)b.classList.add("right");else if(j===i)b.classList.add("wrong");else b.classList.add("fade")});
    const pts=ok?win:lose;
    S.scores[team]+=pts;
    S.done[ci+"-"+r]={who:ok?team:null,pts};
    if(!ok&&pts<0)S.done[ci+"-"+r]={who:team,pts};
    $("score-"+team).textContent=S.scores[team];
    $("score-"+team).classList.remove("bump");void $("score-"+team).offsetWidth;$("score-"+team).classList.add("bump");
    react(ok);
    const dc=pts>0?"plus":pts<0?"minus":"zero";
    $("after").outerHTML=`<p class="explain"><b>${ok?"Rigtigt!":"Det rigtige svar er: "+q[1][0]+"."}</b> ${q[2]}</p>
      <div class="row" style="align-items:center;justify-content:space-between"><span class="delta ${dc}">${pts>0?"+":""}${pts} til ${NAMES[team]}</span><button class="btn" id="next">Fortsæt</button></div>`;
    $("next").onclick=next;
    save();
  });
}

function react(ok){
  const st=document.createElement("div");st.className="stamp "+(ok?"good":"bad");
  st.innerHTML=ok?`<svg viewBox="0 0 24 32"><path d="M14 0 2 18h8l-2 14 14-20h-9z" fill="currentColor"/></svg>RIGTIGT!`:`FORKERT`;
  card.appendChild(st);setTimeout(()=>st.remove(),2000);
  const fl=document.createElement("div");fl.className="flash "+(ok?"good":"bad");document.body.appendChild(fl);setTimeout(()=>fl.remove(),700);
  if(ok){confetti();sound("good")}
  else{card.classList.remove("shake");void card.offsetWidth;card.classList.add("shake");sparks();sound("bad")}
}

function next(){
  hide();
  S.turn=S.turn==="p"?"d":"p";
  if(left()===0){render();finish();return}
  render();
  if(hardPhase()&&!S.announced){
    S.announced=true;save();
    show(`<p class="kd-title">Kun ${left()} spørgsmål tilbage!</p>
     <p class="explain" style="font-size:clamp(18px,2.2vw,24px)">Nu bliver spørgsmålene sværere. Før hvert spørgsmål vælger holdet <b>kvit</b> (spil for de normale point) eller <b>dobbelt</b> (dobbelte point ved rigtigt svar – men man mister pointene ved forkert svar).</p>
     <div class="row"><button class="btn" id="go">Kør!</button></div>`,true);
    sound("phase");zapBurst();
    $("go").onclick=hide;
  }
}

function finish(){
  const p=S.scores.p,d=S.scores.d;
  const w=p===d?null:(p>d?"p":"d");
  show(`<p class="explain" style="text-transform:uppercase;letter-spacing:.1em">Spillet er slut</p>
   <p class="winner" style="color:${w?w==="p"?"var(--girls)":"var(--boys)":"var(--gold)"}">${w?NAMES[w]+" vinder!":"Uafgjort!"}</p>
   <div class="final"><span style="color:var(--girls)">Pigerne ${p}</span><span style="color:var(--boys)">Drengene ${d}</span></div>
   <div class="row" style="justify-content:center"><button class="btn ghost" id="close">Se brættet</button><button class="btn" id="again">Nyt spil</button></div>`);
  sound("good");let n=0;const iv=setInterval(()=>{confetti(w==="p"?"g":w==="d"?"b":null);if(++n>4)clearInterval(iv)},450);
  $("close").onclick=hide;$("again").onclick=()=>{S=fresh();hide();render()};
}

/* Effekter */
const cv=$("fx"),cx=cv.getContext("2d");let parts=[],running=false;
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}size();addEventListener("resize",size);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(bias){
  if(reduce)return;const W=cv.width,H=cv.height,dp=devicePixelRatio;
  const cols=bias==="g"?["#ff6b5b","#ffc83d","#ffd2cc"]:bias==="b"?["#3fc6ff","#ffc83d","#c9efff"]:["#ffc83d","#4be08a","#3fc6ff","#ff6b5b","#c58cff"];
  for(let i=0;i<160;i++){const a=-Math.PI/2+(Math.random()-.5)*1.6,s=(8+Math.random()*12)*dp;
    parts.push({x:W/2,y:H*.55,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.35*dp,w:(6+Math.random()*6)*dp,h:(3+Math.random()*4)*dp,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:120+Math.random()*60,kind:"c"})}
  loop();
}
function sparks(){
  if(reduce)return;const W=cv.width,H=cv.height,dp=devicePixelRatio;
  for(let i=0;i<50;i++){const a=Math.random()*Math.PI*2,s=(2+Math.random()*7)*dp;
    parts.push({x:W/2,y:H*.4,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2*dp,g:.25*dp,len:(8+Math.random()*14)*dp,c:Math.random()<.5?"#ff4d6d":"#7a7f9e",life:40+Math.random()*30,kind:"s"})}
  loop();
}
function zapBurst(){
  if(reduce)return;const W=cv.width,H=cv.height,dp=devicePixelRatio;
  for(let i=0;i<90;i++){const a=Math.random()*Math.PI*2,s=(4+Math.random()*10)*dp;
    parts.push({x:W/2,y:H/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:0,len:(10+Math.random()*20)*dp,c:Math.random()<.6?"#c58cff":"#ffc83d",life:50+Math.random()*30,kind:"s"})}
  loop();
}
function loop(){if(running)return;running=true;requestAnimationFrame(step)}
function step(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life-->0);
  for(const p of parts){
    p.vx*=.985;p.vy=p.vy*.985+p.g;p.x+=p.vx;p.y+=p.vy;
    cx.globalAlpha=Math.min(1,p.life/30);
    if(p.kind==="c"){p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*1.3)));cx.restore()}
    else{const m=Math.hypot(p.vx,p.vy)||1;cx.strokeStyle=p.c;cx.lineWidth=2*devicePixelRatio;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x-p.vx/m*p.len,p.y-p.vy/m*p.len);cx.stroke()}
  }
  cx.globalAlpha=1;
  if(parts.length)requestAnimationFrame(step);else{running=false;cx.clearRect(0,0,cv.width,cv.height)}
}

/* Lyd */
let ac=null;
function tone(f,t0,d,type="sine",vol=.18,slide){
  if(!S.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}
}
function blip(f){tone(f,0,.12,"square",.08)}
function sound(k){
  if(k==="good"){[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.25,"triangle"))}
  else if(k==="bad"){tone(160,0,.5,"sawtooth",.15,70);tone(120,.05,.5,"square",.08,60)}
  else if(k==="phase"){[392,494,587,784,988].forEach((f,i)=>tone(f,i*.07,.3,"square",.08))}
}

/* Knapper */
document.querySelectorAll("[data-turn]").forEach(b=>b.onclick=()=>{S.turn=b.dataset.turn;render()});
document.querySelectorAll("[data-adj]").forEach(b=>b.onclick=()=>{const[k,n]=b.dataset.adj.split(",");S.scores[k]+=+n;render()});
$("sound").onclick=()=>{S.sound=!S.sound;render()};
$("reset").onclick=()=>{
  show(`<p class="kd-title" style="color:var(--gold)">Start et nyt spil?</p><p class="explain">Pointene nulstilles, og alle spørgsmål kommer tilbage på brættet.</p>
   <div class="row"><button class="btn ghost" id="no">Fortsæt dette spil</button><button class="btn" id="yes">Nyt spil</button></div>`);
  $("no").onclick=hide;$("yes").onclick=()=>{S=fresh();hide();render()};
};

function start(data){S=(data&&data.S)||load()||fresh();render()}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
</body>
