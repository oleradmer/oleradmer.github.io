<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tilbygning CAD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: CAD-arbejdsbord — værktøjskolonne | tegneflade med kommandolinje | egenskabspanel */
:root{
  --bg:#e6ebf1; --chrome:#f5f7fa; --panel:#ffffff; --line:#d2d9e2; --line2:#e7ecf2;
  --fg:#17202b; --muted:#5b6879; --accent:#2350c4; --accent-ink:#ffffff; --accent-soft:#e2e9fa;
  --paper:#f8fafc; --ink:#121820; --tone:#c3cad4; --grid:rgba(35,80,196,.055); --grid2:rgba(35,80,196,.12);
  --snap:#0b9a71; --ok:#2c7a51; --warn:#a86a12; --bad:#c0392b;
  --f-ui:'Archivo','Segoe UI',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1217; --chrome:#151a21; --panel:#1a2028; --line:#2b3440; --line2:#232b35;
  --fg:#e3e8ef; --muted:#93a0b1; --accent:#7f9cff; --accent-ink:#0e1217; --accent-soft:#1f2944;
  --paper:#11161c; --ink:#e2e7ee; --tone:#3a4350; --grid:rgba(127,156,255,.045); --grid2:rgba(127,156,255,.10);
  --snap:#36d39c; --ok:#5cc28a; --warn:#e0a542; --bad:#ef6f62; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1217; --chrome:#151a21; --panel:#1a2028; --line:#2b3440; --line2:#232b35;
  --fg:#e3e8ef; --muted:#93a0b1; --accent:#7f9cff; --accent-ink:#0e1217; --accent-soft:#1f2944;
  --paper:#11161c; --ink:#e2e7ee; --tone:#3a4350; --grid:rgba(127,156,255,.045); --grid2:rgba(127,156,255,.10);
  --snap:#36d39c; --ok:#5cc28a; --warn:#e0a542; --bad:#ef6f62; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.35 var(--f-ui);overflow:hidden}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header.top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-block:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--chrome);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;margin-right:8px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.brand svg{width:22px;height:22px}
.brand small{font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.grp{display:flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
.hb{border:0;background:transparent;padding:5px 9px;border-radius:5px;white-space:nowrap}
.hb:hover{background:var(--accent-soft)}
.hb.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
.hb.primary:hover{filter:brightness(1.08)}
.hsel{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 4px}
.hsel select{border:0;background:transparent;font-size:13px;color:var(--fg);text-transform:none;letter-spacing:0;padding:4px 2px}
.spacer{flex:1}
.ptoggle{display:none}

.main{display:grid;grid-template-columns:54px minmax(0,1fr) 304px;min-height:0;position:relative}
nav.tools{display:flex;flex-direction:column;gap:2px;padding:6px 6px;border-right:1px solid var(--line);background:var(--chrome);overflow-y:auto}
.tool{position:relative;width:41px;height:37px;border:1px solid transparent;border-radius:7px;background:transparent;display:grid;place-items:center;color:var(--fg)}
.tool svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:var(--accent-soft)}
.tool.on{background:var(--accent);color:var(--accent-ink)}
.tool kbd{position:absolute;right:2px;bottom:1px;font:600 8px/1 var(--f-mono);opacity:.55}
.tsep{height:1px;background:var(--line);margin:4px 3px}

.stage{position:relative;min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto}
.cvwrap{position:relative;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#cv.sel{cursor:default}
.cmd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:5px 10px;border-top:1px solid var(--line);background:var(--chrome);font:12px/1.4 var(--f-mono);min-height:34px}
.prompt{color:var(--muted);min-width:0;flex:1 1 280px}
.prompt b{color:var(--fg);font-weight:600}
.cin{color:var(--accent);font-weight:600}
.caret{display:inline-block;width:7px;height:14px;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(1) infinite;margin-left:1px}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.caret{animation:none}}
.coords{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.snaps{display:flex;gap:2px;flex-wrap:wrap}
.snaps button{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:2px 6px;font:600 10px/1.3 var(--f-mono);letter-spacing:.04em;color:var(--muted)}
.snaps button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

aside.panel{border-left:1px solid var(--line);background:var(--panel);display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:9px 4px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{overflow-y:auto;padding:12px 14px 24px;display:flex;flex-direction:column;gap:10px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ph h3{margin:0;font-size:15px;font-weight:700}
.ph span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fld{display:grid;grid-template-columns:minmax(0,1fr) 120px;align-items:center;gap:8px}
.fld>span{color:var(--muted);font-size:12px}
.fld input,.fld select{width:100%;min-width:0;border:1px solid var(--line);background:var(--chrome);border-radius:5px;padding:5px 7px;font-variant-numeric:tabular-nums}
.fld.wide{grid-template-columns:1fr}
.fld em{display:none}
.fld .unitwrap{position:relative}
.fld .unitwrap input{padding-right:30px}
.fld .unitwrap i{position:absolute;right:7px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:11px;pointer-events:none}
.fld input[type=checkbox]{width:auto;justify-self:start}
.fld input[type=range]{padding:0}
.ro{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums;padding:2px 0}
.ro span{color:var(--muted);font-size:12px}
.ro b{font-weight:600}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--chrome);border-radius:6px;padding:6px 10px;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.note{font-size:12px;color:var(--muted);line-height:1.45;margin:0}
.box{border:1px solid var(--line2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--chrome)}
.bands{display:flex;flex-direction:column;gap:3px;font-size:12px}
.bands div{display:flex;justify-content:space-between;gap:6px;font-variant-numeric:tabular-nums}
.bands i{font-style:normal;color:var(--muted)}
hr.s{border:0;border-top:1px solid var(--line2);margin:2px 0;width:100%}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px}
.keys kbd{font:600 11px var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--chrome);white-space:nowrap;justify-self:start}

.lrow{display:grid;grid-template-columns:18px 22px minmax(0,1fr) 28px 28px;align-items:center;gap:6px}
.lrow input[type=text]{min-width:0;border:1px solid transparent;background:transparent;padding:4px 5px;border-radius:4px}
.lrow input[type=text]:hover,.lrow input[type=text]:focus{border-color:var(--line);background:var(--chrome)}
.lrow input[type=color]{width:22px;height:22px;border:1px solid var(--line);border-radius:5px;padding:0;background:none}
.ib{border:1px solid var(--line);background:var(--chrome);border-radius:5px;width:28px;height:26px;display:grid;place-items:center;padding:0}
.ib svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib.off{opacity:.45}
.ib.lock{color:var(--warn)}

table.area{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12px}
table.area th{text-align:left;color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:4px 4px;border-bottom:1px solid var(--line)}
table.area td{padding:5px 4px;border-bottom:1px solid var(--line2)}
table.area td.n{text-align:right;white-space:nowrap}
table.area tr.click{cursor:pointer}
table.area tr.click:hover td{background:var(--accent-soft)}
table.area tfoot td{font-weight:700;border-bottom:0}
.pct{display:flex;flex-direction:column;gap:6px}
.pct .big{font:700 26px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:var(--line2);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.05em}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}

.lib{position:absolute;left:8px;top:8px;width:min(320px,calc(100% - 16px));max-height:calc(100% - 16px);display:grid;grid-template-rows:auto auto minmax(0,1fr);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.16);z-index:5;overflow:hidden}
.libh{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.libh h3{margin:0;font-size:15px;flex:1}
.libs{padding:0 12px 8px}
.libs input{width:100%;border:1px solid var(--line);background:var(--chrome);border-radius:6px;padding:6px 9px}
.libb{overflow-y:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:12px}
.libc h4{margin:4px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.libg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.lt{border:1px solid var(--line2);background:var(--chrome);border-radius:8px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--fg);min-width:0}
.lt:hover{border-color:var(--accent)}
.lt.on{border-color:var(--accent);background:var(--accent-soft)}
.lt svg{width:100%;height:52px;color:var(--fg)}
.lt span{font-size:11px;line-height:1.2;text-align:center;overflow-wrap:anywhere}
.lt i{font-style:normal;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.x{border:0;background:transparent;font-size:18px;line-height:1;padding:2px 6px;border-radius:5px;color:var(--muted)}
.x:hover{background:var(--accent-soft);color:var(--fg)}
.cbtns{display:flex;gap:4px;flex-wrap:wrap}
.cbtns button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 10px;min-height:30px;font:500 12px/1 var(--f-ui);color:var(--fg)}
.cbtns button:hover{border-color:var(--accent);color:var(--accent)}
.cbtns button.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#cmdIn{width:150px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 8px;font:12px var(--f-mono);min-height:30px}
.warnbox{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 7%,transparent)}
.warnbox p{color:var(--bad);margin:0;font-size:12px;line-height:1.45}
.vtabs{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.vtabs button{border:1px solid var(--line);background:var(--chrome);border-radius:6px;padding:4px 9px;font-size:12px}
.vtabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vtabs span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 2px 0 8px}
.sline{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:12px;padding:2px 0}
.sline i{display:block;font-style:normal;color:var(--muted);font-size:11px}
.sline b{font-variant-numeric:tabular-nums}
.mfoot .note{max-width:none}
.m3dbox{width:min(1400px,100%);height:min(92vh,100%)}
.g3wrap{position:relative;min-height:0;background:linear-gradient(#dfe8f1,#f4f6f8);overflow:hidden}
.g3wrap canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.setlist{display:flex;flex-direction:column;gap:6px}
.setlist a{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(56px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--panel);padding:9px 14px;border-radius:8px;font-size:13px;max-width:min(560px,calc(100vw - 32px));box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

.modal{position:fixed;inset:0;background:rgba(10,14,20,.45);display:grid;place-items:center;z-index:20;padding:16px}
.mbox{background:var(--panel);border-radius:12px;width:min(1100px,100%);max-height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mhead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mhead strong{font-size:15px}
.mbody{overflow:auto;background:var(--paper);padding:12px;min-height:240px}
.mbody svg{display:block;width:100%;height:auto;max-height:70vh}
.mfoot{padding:8px 14px;border-top:1px solid var(--line)}

@media (max-width:860px){
  .main{grid-template-columns:50px minmax(0,1fr)}
  aside.panel{position:absolute;right:0;top:0;bottom:0;width:min(320px,92vw);transform:translateX(102%);transition:transform .2s;z-index:10;box-shadow:-8px 0 24px rgba(0,0,0,.15)}
  body.popen aside.panel{transform:none}
  .ptoggle{display:inline-flex}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){aside.panel{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V9l7-5 7 5v12z" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round"/><path d="M17 12h4v9h-4" fill="none" stroke="var(--fg)" stroke-width="1.8" stroke-linejoin="round"/><path d="M7 21v-6h6v6" fill="none" stroke="var(--fg)" stroke-width="1.5"/></svg>
      <span>Tilbygning CAD</span><small>prototype</small>
    </div>
    <div class="grp">
      <button class="hb" data-act="new" title="Ny, tom tegning">Ny</button>
      <button class="hb" data-act="open" title="Åbn projektfil (.json)">Åbn</button>
      <button class="hb" data-act="save" title="Gem projektfil (Ctrl+S)">Gem</button>
    </div>
    <div class="grp">
      <button class="hb" data-act="undo" title="Fortryd (Ctrl+Z)">↶</button>
      <button class="hb" data-act="redo" title="Gentag (Ctrl+Y)">↷</button>
      <button class="hb" data-act="zoomFit" title="Zoom til tegningen (F)">Zoom alt</button>
    </div>
    <div class="grp">
      <label class="hsel">Mål <select id="hScale" data-id="_set" data-f="scale" data-t="num"></select></label>
      <label class="hsel">Ark <select id="hPaper" data-id="_set" data-f="paperO" data-t="str"></select></label>
      <label class="hsel">Etage <select id="hFloor" aria-label="Aktiv etage"></select></label>
      <label class="hsel">Enhed <select id="hUnit" data-id="_set" data-f="unit" data-t="str"><option value="mm">mm</option><option value="cm">cm</option></select></label>
    </div>
    <div class="grp">
      <button class="hb" data-act="import" title="Læg en tegning, BBR-skitse eller PDF ind som baggrund">Underlag…</button>
      <button class="hb" data-act="views" title="Situationsplan, facader og snit – til byggeansøgningen">Tegninger</button>
      <button class="hb" data-act="v3d" title="Se huset i 3D">3D</button>
    </div>
    <span class="spacer"></span>
    <div class="grp">
      <button class="hb primary" data-act="pdf" title="PDF i eksakt målestok med tegningshoved">PDF</button>
      <button class="hb" data-act="svg" title="SVG-ark i målestok">SVG</button>
      <button class="hb" data-act="dxf" title="DXF til ingeniør/arkitekt (1 enhed = 1 mm)">DXF</button>
    </div>
    <button class="hb ptoggle grp" data-act="panelToggle">Panel</button>
  </header>

  <div class="main">
    <nav class="tools" id="tools" aria-label="Værktøjer"></nav>
    <div class="stage">
      <div class="cvwrap"><canvas id="cv" aria-label="Tegneflade"></canvas>
        <div class="lib" id="lib" hidden><div class="libh"><h3>Bibliotek</h3><button class="x" data-act="libclose" aria-label="Luk biblioteket">×</button></div><div class="libs"><input type="search" id="libq" placeholder="Søg: dør, vindue, ovn, seng …" aria-label="Søg i biblioteket"></div><div class="libb" id="libb"></div></div></div>
      <div class="cmd">
        <div class="prompt"><span id="prompt"></span> <span class="cin" id="cin"></span><span class="caret" id="caret" hidden></span></div>
        <input id="cmdIn" type="text" autocomplete="off" spellcheck="false" placeholder="Mål, fx 4800" aria-label="Indtast mål eller tekst" hidden>
        <div class="cbtns" id="cbtns"></div>
        <span class="coords" id="coords"></span>
        <div class="snaps" id="snaps"></div>
      </div>
    </div>
    <aside class="panel">
      <div class="tabs" role="tablist">
        <button data-act="tab" data-tab="props" class="on">Egenskaber</button>
        <button data-act="tab" data-tab="layers">Lag</button>
        <button data-act="tab" data-tab="areas">Areal</button>
        <button data-act="tab" data-tab="project">Projekt</button>
      </div>
      <div class="pbody" id="pbody"></div>
    </aside>
  </div>
</div>

<div class="modal" id="m3d" hidden>
  <div class="mbox m3dbox">
    <div class="mhead"><strong>3D</strong><div class="vtabs"><span>Se fra</span><button data-act="cam" data-v="iso">Fugleperspektiv</button><button data-act="cam" data-v="S">Syd</button><button data-act="cam" data-v="N">Nord</button><button data-act="cam" data-v="O">Øst</button><button data-act="cam" data-v="W">Vest</button></div><span class="spacer"></span>
      <label class="hsel">Etager <select id="g3floor" aria-label="Vis etager op til"></select></label>
      <label class="hsel"><input type="checkbox" id="g3roof" checked> Tag</label>
      <label class="hsel"><input type="checkbox" id="g3furn" checked> Inventar</label>
      <label class="hsel">Sol <input type="range" id="g3sun" min="0" max="360" step="5" value="200" aria-label="Solens retning"></label>
      <button class="btn" data-act="g3png">Gem billede</button>
      <button class="btn" data-act="g3close">Luk</button></div>
    <div class="g3wrap" id="g3wrap"><p class="note" id="g3msg" style="padding:24px">Indlæser 3D …</p></div>
    <div class="mfoot"><p class="note">Træk for at dreje · højreklik-træk eller Shift-træk for at panorere · hjul eller to fingre for at zoome. Modellen bygges fra vægge, vinduer, døre, gulve, tag og inventar.</p></div>
  </div>
</div>
<div class="modal" id="secModal" hidden>
  <div class="mbox">
    <div class="mhead"><strong id="secTitle">Tegninger</strong><div class="vtabs" id="vtabs"></div><span class="spacer"></span>

'use strict';
/* ====================================================================
   KERNE: konstanter, geometri, model
   ==================================================================== */
const PI=Math.PI, DEG=PI/180;
const V={
  add:(a,b)=>({x:a.x+b.x,y:a.y+b.y}), sub:(a,b)=>({x:a.x-b.x,y:a.y-b.y}),
  mul:(a,k)=>({x:a.x*k,y:a.y*k}), dot:(a,b)=>a.x*b.x+a.y*b.y, cross:(a,b)=>a.x*b.y-a.y*b.x,
  len:a=>Math.hypot(a.x,a.y), dist:(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),
  norm:a=>{const l=Math.hypot(a.x,a.y)||1;return{x:a.x/l,y:a.y/l}},
  nl:u=>({x:u.y,y:-u.x}),              /* venstre normal set på skærmen (y nedad) */
  lerp:(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}),
};
const n2p=x=>((x%(2*PI))+2*PI)%(2*PI);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function lineX(p,d,q,e){const c=V.cross(d,e);if(Math.abs(c)<1e-9)return null;const s=V.cross(V.sub(q,p),e)/c;return V.add(p,V.mul(d,s));}
function segX(a,b,c,d){const r=V.sub(b,a),s=V.sub(d,c),den=V.cross(r,s);if(Math.abs(den)<1e-9)return null;const t=V.cross(V.sub(c,a),s)/den,u=V.cross(V.sub(c,a),r)/den;if(t<-1e-9||t>1+1e-9||u<-1e-9||u>1+1e-9)return null;return V.add(a,V.mul(r,t));}
function distPtSeg(p,a,b){const ab=V.sub(b,a),L2=V.dot(ab,ab);let t=L2?V.dot(V.sub(p,a),ab)/L2:0;t=clamp(t,0,1);const q=V.add(a,V.mul(ab,t));return{d:V.dist(p,q),q,t};}
function pip(p,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if(((a.y>p.y)!==(b.y>p.y))&&(p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x))ins=!ins;}return ins;}
function polyArea(poly){let s=0;for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];s+=a.x*b.y-b.x*a.y;}return s/2;}
function polyPerim(poly,closed=true){let s=0;const n=poly.length;for(let i=0;i<(closed?n:n-1);i++)s+=V.dist(poly[i],poly[(i+1)%n]);return s;}
function centroid(poly){const A=polyArea(poly);if(Math.abs(A)<1e-6){let x=0,y=0;for(const p of poly){x+=p.x;y+=p.y;}return{x:x/poly.length,y:y/poly.length};}let cx=0,cy=0;for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],f=a.x*b.y-b.x*a.y;cx+=(a.x+b.x)*f;cy+=(a.y+b.y)*f;}return{x:cx/(6*A),y:cy/(6*A)};}
function clipSeg(a,b,poly){const ts=[0,1],d=V.sub(b,a),n=poly.length;for(let i=0;i<n;i++){const e=poly[i],f=poly[(i+1)%n],s=V.sub(f,e),den=V.cross(d,s);if(Math.abs(den)<1e-12)continue;const ea=V.sub(e,a),t=V.cross(ea,s)/den,u=V.cross(ea,d)/den;if(u>=-1e-9&&u<=1+1e-9&&t>0&&t<1)ts.push(t);}ts.sort((x,y)=>x-y);const out=[];for(let i=0;i<ts.length-1;i++){const t0=ts[i],t1=ts[i+1];if(t1-t0<1e-9)continue;if(pip(V.lerp(a,b,(t0+t1)/2),poly))out.push([V.lerp(a,b,t0),V.lerp(a,b,t1)]);}return out;}
function mergeIv(list){const l=list.filter(x=>x[1]>x[0]).map(x=>x.slice()).sort((a,b)=>a[0]-b[0]);const out=[];for(const iv of l){if(out.length&&iv[0]<=out[out.length-1][1]+1e-6)out[out.length-1][1]=Math.max(out[out.length-1][1],iv[1]);else out.push(iv);}return out;}
function subIv(range,cuts){let cur=[range.slice()];for(const [c0,c1] of cuts){const nx=[];for(const [a,b] of cur){if(c1<=a||c0>=b){nx.push([a,b]);continue;}if(c0>a)nx.push([a,c0]);if(c1<b)nx.push([c1,b]);}cur=nx;}return cur;}
function circleFrom3(a,b,c){const d=2*(a.x*(b.y-c.y)+b.x*(c.y-a.y)+c.x*(a.y-b.y));if(Math.abs(d)<1e-9)return null;const a2=a.x*a.x+a.y*a.y,b2=b.x*b.x+b.y*b.y,c2=c.x*c.x+c.y*c.y;const ux=(a2*(b.y-c.y)+b2*(c.y-a.y)+c2*(a.y-b.y))/d,uy=(a2*(c.x-b.x)+b2*(a.x-c.x)+c2*(b.x-a.x))/d;return{x:ux,y:uy};}

function longestDir(poly){let best=null,bl=-1;for(let i=0;i<poly.length;i++){const d=V.sub(poly[(i+1)%poly.length],poly[i]),l=V.len(d);if(l>bl){bl=l;best=d;}}return best?V.norm(best):{x:1,y:0};}

function fmtLen(mm){if(P.set.unit==='cm'){const v=Math.round(mm)/10;return String(v).replace('.',',');}return String(Math.round(mm));}

/* ====================================================================
   GEOMETRI: vægge med hjørnesamling, åbninger, rum
   ==================================================================== */
function wpt(g,s,d){return{x:g.w.a.x+g.u.x*s+g.n.x*d,y:g.w.a.y+g.u.y*s+g.n.y*d};}
/* samlinger regnes kun, når vinklen er tydelig; flade vinkler (< ca. 12°) er overlap, ikke hjørner */
const JOINT_SIN=0.2,FOLD_COS=0.978;
const awayDir=(g,end)=>end==='a'?g.u:V.mul(g.u,-1);
function joint(g,end,gs){
  const P0=g.w[end],Q=g.w[end==='a'?'b':'a'],dg=awayDir(g,end);let best=null,bs=-1;
  for(const h of gs){if(h===g)continue;for(const e2 of ['a','b']){if(V.dist(h.w[e2],P0)<1.5){if(V.dot(dg,awayDir(h,e2))>FOLD_COS)continue;const s=Math.abs(V.cross(g.u,h.u));if(s>bs){bs=s;best={mode:'miter',h,e2};}}}}
  if(best)return best;
  for(const h of gs){if(h===g)continue;if(Math.abs(V.cross(g.u,h.u))<JOINT_SIN)continue;const rel=V.sub(P0,h.w.a),r=V.dot(rel,h.u),pd=V.dot(rel,h.n);
    if(r>1&&r<h.L-1&&Math.abs(pd)<=h.t/2+1.5){const side=Math.sign(V.dot(V.sub(Q,h.w.a),h.n))||1;return{mode:'tee',h,side};}}
  return{mode:'free'};
}
function endPts(g,end){
  const J=g.ends[end],P0=g.w[end],out=[];let miss=false;
  for(const d of g.offs){const base=V.add(P0,V.mul(g.n,d));let X=null;
    if(J.mode==='miter'){const h=J.h,f=((end==='b')!==(J.e2==='b'))?1:-1,dd=clamp(f*d,-h.t/2,h.t/2);
      if(Math.abs(V.cross(g.u,h.u))>0.02){X=lineX(base,g.u,V.add(P0,V.mul(h.n,dd)),h.u);if(X&&V.dist(X,P0)>4*Math.max(g.t,h.t))X=null;}}
    else if(J.mode==='tee'){const h=J.h,F0=V.add(h.w.a,V.mul(h.n,J.side*h.t/2));X=lineX(base,g.u,F0,h.u);if(X&&V.dist(X,P0)>4*Math.max(g.t,h.t))X=null;}
    out.push(X||base);if(!X&&J.mode!=='free')miss=true;}
  /* alle lag eller ingen: blandede snit gav skæve vægender */
  if(miss){const flat=J.mode==='miter'&&Math.abs(V.cross(g.u,J.h.u))<=0.02;for(let i=0;i<g.offs.length;i++)out[i]=V.add(P0,V.mul(g.n,g.offs[i]));if(!flat){g.ends[end]={mode:'free'};return out;}}
  if(J.mode==='tee'){const h=J.h,r0=V.dot(V.sub(out[0],h.w.a),h.u),r1=V.dot(V.sub(out[out.length-1],h.w.a),h.u);(J.side>0?h.gapL:h.gapR).push([Math.min(r0,r1),Math.max(r0,r1)]);}
  return out;
}
function buildWallLines(g,ops){
  const nO=g.offs.length,last=nO-1;
  g.sA=g.A.map(p=>V.dot(V.sub(p,g.w.a),g.u));g.sB=g.B.map(p=>V.dot(V.sub(p,g.w.a),g.u));
  const oi=mergeIv(ops.map(og=>[og.s0,og.s1]));g.oi=oi;g.ops=ops;
  const heavy=[],thin=[];
  for(let i=0;i<nO;i++){const d=g.offs[i];let cut=oi.slice();if(i===0)cut=cut.concat(g.gapL);if(i===last)cut=cut.concat(g.gapR);
    for(const [x0,x1] of subIv([g.sA[i],g.sB[i]],mergeIv(cut))){if(x1-x0<0.5)continue;(i===0||i===last?heavy:thin).push([wpt(g,x0,d),wpt(g,x1,d)]);}}
  if(g.ends.a.mode==='free')heavy.push([g.A[0],g.A[last]]);
  if(g.ends.b.mode==='free')heavy.push([g.B[0],g.B[last]]);
  for(const [o0,o1] of oi)for(const s of [o0,o1])heavy.push([wpt(g,s,g.t/2),wpt(g,s,-g.t/2)]);
  const pcs=[],solid=subIv([-Infinity,Infinity],oi);
  for(let j=0;j<g.bands.length;j++){const d1=g.offs[j],d2=g.offs[j+1],mat=g.bands[j][1];
    for(const [x0,x1] of solid){const sa=x0===-Infinity?g.A[j]:wpt(g,x0,d1),sb=x0===-Infinity?g.A[j+1]:wpt(g,x0,d2),ea=x1===Infinity?g.B[j]:wpt(g,x1,d1),eb=x1===Infinity?g.B[j+1]:wpt(g,x1,d2);pcs.push({poly:[sa,ea,eb,sb],mat,kind:'solid',band:j});}
    for(const og of ops)pcs.push({poly:[wpt(g,og.s0,d1),wpt(g,og.s1,d1),wpt(g,og.s1,d2),wpt(g,og.s0,d2)],mat,kind:'open',op:og.o,band:j});}
  g.heavy=heavy;g.thin=thin;g.pieces=pcs;
}
function buildGraph(gs){
  const nodes=[];const nid=p=>{for(let i=0;i<nodes.length;i++)if(Math.abs(nodes[i].x-p.x)<2&&Math.abs(nodes[i].y-p.y)<2)return i;nodes.push({x:p.x,y:p.y});return nodes.length-1;};
  const splits=new Map(gs.map(g=>[g,[0,g.L]]));const raw=[];
  for(const g of gs)for(const end of ['a','b']){const P0=g.w[end];for(const h of gs){if(h===g)continue;const rel=V.sub(P0,h.w.a),r=V.dot(rel,h.u),pd=V.dot(rel,h.n);
    if(r>1&&r<h.L-1&&Math.abs(pd)<=h.t/2+1.5&&Math.abs(V.cross(g.u,h.u))>0.02){splits.get(h).push(r);if(Math.abs(pd)>1.5)raw.push([P0,V.add(h.w.a,V.mul(h.u,r)),g.t,g]);}}}

  const M=MATS[mat];if(!M||M.k==='none'||M.k==='tone'||poly.length<3)return[];
  const dir=ax&&ax.dir?ax.dir:longestDir(poly),segs=[];
  const par=(angDeg,sp)=>{const a=Math.atan2(dir.y,dir.x)+angDeg*DEG,ld={x:Math.cos(a),y:Math.sin(a)},nn=V.nl(ld),S=sp*u;let mn=1/0,mx=-1/0,tn=1/0,tx=-1/0;
    for(const p of poly){const c=V.dot(p,nn),t=V.dot(p,ld);mn=Math.min(mn,c);mx=Math.max(mx,c);tn=Math.min(tn,t);tx=Math.max(tx,t);}
    const k0=Math.ceil(mn/S),k1=Math.floor(mx/S);if(k1-k0>3000)return;
    for(let k=k0;k<=k1;k++){const base=V.mul(nn,k*S);for(const s of clipSeg(V.add(base,V.mul(ld,tn-1)),V.add(base,V.mul(ld,tx+1)),poly))segs.push(s);}};
  if(M.k==='lines')par(M.ang,M.sp);
  else if(M.k==='cross'){par(45,M.sp);par(-45,M.sp);}
  else if(M.k==='wood')par(0,M.sp);
  else if(M.k==='zig'){const nn=V.nl(dir);let mn=1/0,mx=-1/0,tn=1/0,tx=-1/0;for(const p of poly){const c=V.dot(p,nn),t=V.dot(p,dir);mn=Math.min(mn,c);mx=Math.max(mx,c);tn=Math.min(tn,t);tx=Math.max(tx,t);}
    const w=mx-mn;if(w<1)return segs;const ins=w*0.06,half=w*0.38,k0=Math.floor(tn/half)-1,k1=Math.ceil(tx/half)+1;if(k1-k0>4000)return segs;
    const pt=k=>V.add(V.mul(dir,k*half),V.mul(nn,(k%2===0)?mn+ins:mx-ins));
    for(let k=k0;k<k1;k++)for(const s of clipSeg(pt(k),pt(k+1),poly))segs.push(s);}
  return segs;
}

  circle(c,r,st,fill){this.o.push(`<circle cx="${f2(c.x)}" cy="${f2(c.y)}" r="${f2(r)}" fill="${fill?this.col(fill):'none'}" ${this.sa(st)}/>`);}
  arc(c,r,a0,a1,st={}){const span=n2p(a1-a0)||2*PI;if(span>=2*PI-1e-6){this.circle(c,r,st);return;}const p0={x:c.x+r*Math.cos(a0),y:c.y+r*Math.sin(a0)},p1={x:c.x+r*Math.cos(a0+span),y:c.y+r*Math.sin(a0+span)};this.o.push(`<path d="M${f2(p0.x)} ${f2(p0.y)}A${f2(r)} ${f2(r)} 0 ${span>PI?1:0} 1 ${f2(p1.x)} ${f2(p1.y)}" fill="none" ${this.sa(st)}/>`);}

function dxfName(n){return String(n).replace(/æ/g,'ae').replace(/ø/g,'oe').replace(/å/g,'aa').replace(/Æ/g,'AE').replace(/Ø/g,'OE').replace(/Å/g,'AA').replace(/[^A-Za-z0-9_-]+/g,'_').toUpperCase()||'0';}

function aci(hex){if(!hex)return 7;const m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);if(!m)return 7;const c=[1,2,3].map(i=>parseInt(m[i],16));const T=[[1,[255,0,0]],[2,[255,255,0]],[3,[0,160,0]],[4,[0,200,200]],[5,[0,0,255]],[6,[255,0,255]],[8,[128,128,128]],[30,[200,100,20]],[7,[0,0,0]]];let best=7,bd=1e9;for(const [i,r] of T){const d=(r[0]-c[0])**2+(r[1]-c[1])**2+(r[2]-c[2])**2;if(d<bd){bd=d;best=i;}}return best;}
class DXFPainter{

  col(){return null;}
  r(v){return(Math.round(v*1000)/1000).toString();}
  line(a,b){this.e.push(`0\nLINE\n8\n${this.ln}\n10\n${this.r(a.x)}\n20\n${this.r(-a.y)}\n30\n0\n11\n${this.r(b.x)}\n21\n${this.r(-b.y)}\n31\n0`);}

const LV=id=>{const L=layerById(id);return!!(L&&L.visible);};
function setL(p,id){p.setLayer(layerById(id)||P.layers[0]);}
function arrowHead(p,tip,dir,size){const n=V.nl(dir),b=V.sub(tip,V.mul(dir,size));p.poly([tip,V.add(b,V.mul(n,size*0.35)),V.sub(b,V.mul(n,size*0.35))],true,null,'ink');}

function drawDim(p,p1,p2,mode,off){
  const D=dimGeom(p1,p2,mode,off);if(!D)return null;const u=p.u;
  for(const [pt,Dp] of [[p1,D.D1],[p2,D.D2]]){const v=V.sub(Dp,pt),L=V.len(v);if(L>1.5*u){const vn=V.mul(v,1/L);p.line(V.add(pt,V.mul(vn,1.2*u)),V.add(Dp,V.mul(vn,1.6*u)),{w:LW.fine});}}
  const ex=V.mul(D.dir,1.4*u);p.line(V.sub(D.D1,ex),V.add(D.D2,ex),{w:LW.fine});
  const tk=V.mul(V.norm(V.add(D.dir,D.n)),1.1*u);for(const Dp of [D.D1,D.D2])p.line(V.sub(Dp,tk),V.add(Dp,tk),{w:LW.thin});
  let td=D.dir;if(td.x<-1e-9||(Math.abs(td.x)<1e-9&&td.y>0))td=V.mul(td,-1);
  const up=V.nl(td),mid=V.lerp(D.D1,D.D2,.5),rot=Math.atan2(-td.y,td.x)/DEG;
  p.text(fmtLen(D.val),V.add(mid,V.mul(up,0.9*u)),{h:2.5,anchor:'middle',rot});
  return D;
}
function drawOpening(p,og){
  const {g,s0,s1,o}=og,t=g.t,w=s1-s0;
  if(o.kind==='window'){const d1=t*0.12;p.line(wpt(g,s0,d1),wpt(g,s1,d1),{w:LW.thin});p.line(wpt(g,s0,-d1),wpt(g,s1,-d1),{w:LW.thin});p.line(wpt(g,s0,0),wpt(g,s1,0),{w:LW.fine});
    const n=Math.max(1,Math.round(o.panes||1));for(let k=1;k<n;k++){const s=s0+k*w/n;p.line(wpt(g,s,d1),wpt(g,s,-d1),{w:LW.thin});}return;}
  const sg=o.swing||1,st=o.style||'single';
  const leaf=(hs,fs,len)=>{const H=wpt(g,hs,sg*t/2),T=V.add(H,V.mul(g.n,sg*len)),C=wpt(g,fs,sg*t/2);p.line(H,T,{w:LW.med});const aT=Math.atan2(T.y-H.y,T.x-H.x),aC=Math.atan2(C.y-H.y,C.x-H.x);let a0=aT,a1=aC;if(n2p(a1-a0)>PI){a0=aC;a1=aT;}p.arc(H,len,a0,a1,{w:LW.fine});};
  if(st==='double'){leaf(s0,s0+w/2,w/2);leaf(s1,s1-w/2,w/2);}
  else if(st==='slide'){const d1=t*0.15,L=w*0.55;p.line(wpt(g,s0,d1),wpt(g,s0+L,d1),{w:LW.med});p.line(wpt(g,s1-L,-d1),wpt(g,s1,-d1),{w:LW.med});const a=wpt(g,s0+w*0.3,sg*(t/2+0.12*w)),b=wpt(g,s0+w*0.7,sg*(t/2+0.12*w));p.line(a,b,{w:LW.fine});arrowHead(p,b,g.u,1.6*p.u);}
  else if(st==='port'){p.line(wpt(g,s0,0),wpt(g,s1,0),{w:LW.thin,dash:[3,1.5]});}
  else leaf(o.hinge==='R'?s1:s0,o.hinge==='R'?s0:s1,w);
}

function symXf(o){const A=(o.rot||0)*DEG,c=Math.cos(A),s=Math.sin(A);return(x,y)=>{const lx=o.mirror?o.w-x:x;return{x:o.p.x+lx*c+y*s,y:o.p.y-lx*s+y*c};};}
function symLocal(o,q){const A=(o.rot||0)*DEG,c=Math.cos(A),s=Math.sin(A),dx=q.x-o.p.x,dy=q.y-o.p.y;let lx=dx*c-dy*s;const y=dx*s+dy*c;if(o.mirror)lx=o.w-lx;return{x:lx,y};}
function symPainter(p,o){const T=symXf(o),A=(o.rot||0)*DEG,mir=!!o.mirror,S=st=>st===null?null:(st||{w:LW.thin});
  let tr=(((o.rot||0)%360)+360)%360;if(tr>90&&tr<=270)tr-=180;else if(tr>270)tr-=360;
  return{u:p.u,
    line:(x1,y1,x2,y2,st)=>p.line(T(x1,y1),T(x2,y2),st||{w:LW.fine}),
    rect:(x,y,w,h,st,fill)=>p.poly([T(x,y),T(x+w,y),T(x+w,y+h),T(x,y+h)],true,S(st),fill),
    poly:(pts,closed,st,fill)=>p.poly(pts.map(q=>T(q[0],q[1])),closed,S(st),fill),
    circle:(x,y,r,st,fill)=>p.circle(T(x,y),r,st===null?null:(st||{w:LW.fine}),fill),
    arc:(x,y,r,a0,a1,st)=>{let b0=a0,b1=a1;if(mir){b0=PI-a1;b1=PI-a0;}p.arc(T(x,y),r,b0-A,b1-A,st||{w:LW.fine});},
    ellipse:(cx,cy,rx,ry,st)=>{const pts=[];for(let i=0;i<48;i++){const a=i/48*2*PI;pts.push(T(cx+rx*Math.cos(a),cy+ry*Math.sin(a)));}p.poly(pts,true,st||{w:LW.fine});},
    text:(s,x,y,opt)=>p.text(s,T(x,y),Object.assign({h:1.8,anchor:'middle',valign:'middle',rot:tr},opt||{})),
    hatch:(x,y,w,h,mat)=>p.segs(hatchSegs([T(x,y),T(x+w,y),T(x+w,y+h),T(x,y+h)],mat,p.u),{w:LW.hatch}),
  };}
function drawSym(p,o){const D=SYMS[o.k];if(D)D.draw(symPainter(p,o),o);}
function symCorners(o){const T=symXf(o);return[T(0,0),T(o.w,0),T(o.w,o.d),T(0,o.d)];}
function clipLine(pt,dir,poly){return clipSeg(V.sub(pt,V.mul(dir,1e6)),V.add(pt,V.mul(dir,1e6)),poly);}
/* ---------- tage der overlapper: skjulte linjer og skotrender ---------- */
const bbOf=pts=>{let x0=1/0,y0=1/0,x1=-1/0,y1=-1/0;for(const q of pts){x0=Math.min(x0,q.x);y0=Math.min(y0,q.y);x1=Math.max(x1,q.x);y1=Math.max(y1,q.y);}return{x0,y0,x1,y1};};
const bbHit=(a,b)=>!(a.x1<b.x0||b.x1<a.x0||a.y1<b.y0||b.y1<a.y0);
function edgeDist(m,pts){let d=Infinity;for(let i=0;i<pts.length;i++)d=Math.min(d,distPtSeg(m,pts[i],pts[(i+1)%pts.length]).d);return d;}
function roofHidden(m,o,others){const z=roofZFn(o)(m);for(const R of others)if(pip(m,R.pts)&&edgeDist(m,R.pts)>3&&roofZFn(R)(m)>=z-2)return true;return false;}
function clipRoofSeg(a,b,o,others){if(!others.length)return[[a,b]];const N=32,vis=t=>!roofHidden(V.lerp(a,b,t),o,others),ts=[],vs=[];
  for(let k=0;k<=N;k++){const t=k/N;ts.push(t);vs.push(vis(t));}const out=[];let start=vs[0]?0:null;
  for(let k=1;k<=N;k++){if(vs[k]===vs[k-1])continue;let lo=ts[k-1],hi=ts[k];for(let it=0;it<12;it++){const mid=(lo+hi)/2;if(vis(mid)===vs[k-1])lo=mid;else hi=mid;}const tb=(lo+hi)/2;
    if(vs[k-1]){out.push([V.lerp(a,b,start),V.lerp(a,b,tb)]);start=null;}else start=tb;}
  if(start!==null)out.push([V.lerp(a,b,start),b]);return out.filter(s=>V.dist(s[0],s[1])>1);}
function roofPainter(p,o,others){if(!others.length)return p;const cl=(a,b)=>clipRoofSeg(a,b,o,others);
  return{u:p.u,setLayer:L=>p.setLayer(L),col:c=>p.col(c),
    line:(a,b,st)=>{for(const s of cl(a,b))p.line(s[0],s[1],st);},
    segs:(list,st)=>{const o2=[];for(const [a,b] of list)o2.push(...cl(a,b));p.segs(o2,st);},
    poly:(pts,closed,st,fill)=>{if(fill){if(!roofHidden(centroid(pts),o,others))p.poly(pts,closed,st,fill);return;}const sg=[];for(let i=0;i<pts.length-(closed?0:1);i++)sg.push([pts[i],pts[(i+1)%pts.length]]);const o2=[];for(const [a,b] of sg)o2.push(...cl(a,b));p.segs(o2,st);},
    text:(str,pt,opt)=>{if(!roofHidden(pt,o,others))p.text(str,pt,opt);},circle:(...a)=>p.circle(...a),arc:(...a)=>p.arc(...a)};}
let VLV=-1,VLC=new Map();
function roofValleys(A,B){if(VLV!==MV){VLC.clear();VLV=MV;}const key=A.id+'|'+B.id;if(VLC.has(key))return VLC.get(key);
  const ba=bbOf(A.pts),bb=bbOf(B.pts),x0=Math.max(ba.x0,bb.x0),x1=Math.min(ba.x1,bb.x1),y0=Math.max(ba.y0,bb.y0),y1=Math.min(ba.y1,bb.y1),out=[];
  if(x1>x0&&y1>y0){const N=60,fa=roofZFn(A),fb=roofZFn(B),gx=i=>x0+(x1-x0)*i/N,gy=j=>y0+(y1-y0)*j/N,F=[],IN=[];
    for(let i=0;i<=N;i++){F[i]=[];IN[i]=[];for(let j=0;j<=N;j++){const q={x:gx(i),y:gy(j)};IN[i][j]=pip(q,A.pts)&&pip(q,B.pts);F[i][j]=fa(q)-fb(q);}}
    const ip=(p1,v1,p2,v2)=>V.lerp(p1,p2,v1/(v1-v2));
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){if(!(IN[i][j]&&IN[i+1][j]&&IN[i][j+1]&&IN[i+1][j+1]))continue;
      const c=[[{x:gx(i),y:gy(j)},F[i][j]],[{x:gx(i+1),y:gy(j)},F[i+1][j]],[{x:gx(i+1),y:gy(j+1)},F[i+1][j+1]],[{x:gx(i),y:gy(j+1)},F[i][j+1]]],pts=[];
      if(!c.some(q=>q[1]>1)||!c.some(q=>q[1]<-1))continue;for(let k=0;k<4;k++){const [p1,v1]=c[k],[p2,v2]=c[(k+1)%4];if((v1<0)!==(v2<0)&&Math.abs(v1-v2)>2)pts.push(ip(p1,v1,p2,v2));}
      if(pts.length===2)out.push(pts);else if(pts.length===4){out.push([pts[0],pts[1]],[pts[2],pts[3]]);}}}
  VLC.set(key,out);return out;}
function drawRoof(p0,o,others=[]){
  if(!o.pts||o.pts.length<3)return;others=others.filter(R=>R!==o&&bbHit(bbOf(R.pts),bbOf(o.pts)));const p=roofPainter(p0,o,others);const u=p.u;p.poly(o.pts,true,{w:LW.med,dash:[4,1.5]});
  const c=centroid(o.pts),dv={x:Math.cos(o.dir*DEG),y:-Math.sin(o.dir*DEG)},m=V.nl(dv),cc=Math.max(200,o.cc||900);
  const ext=(d)=>{let mn=1/0,mx=-1/0;for(const v of o.pts){const t=V.dot(V.sub(v,c),d);mn=Math.min(mn,t);mx=Math.max(mx,t);}return[mn,mx];};
  const rafters=(lineDir,stepDir)=>{const [mn,mx]=ext(stepDir);const k0=Math.ceil(mn/cc),k1=Math.floor(mx/cc);if(k1-k0>300)return;const segs=[];for(let k=k0;k<=k1;k++)for(const s of clipLine(V.add(c,V.mul(stepDir,k*cc)),lineDir,o.pts))segs.push(s);p.segs(segs,{w:LW.hatch,dash:[2,1]});};
  const lab=`${String(o.pitch).replace('.',',')}°`;
  if(o.kind==='saddel'){for(const s of clipLine(c,dv,o.pts))p.line(s[0],s[1],{w:LW.thin,dash:[6,1.2,1,1.2]});rafters(m,dv);
    const [mn,mx]=ext(m);for(const sg of [1,-1]){const a=V.add(c,V.mul(m,sg*(sg>0?mx:-mn)*0.25)),b=V.add(c,V.mul(m,sg*(sg>0?mx:-mn)*0.7));p.line(a,b,{w:LW.thin});arrowHead(p,b,V.mul(m,sg),2.2*u);p.text(lab,V.add(V.lerp(a,b,.5),V.mul(dv,1.2*u)),{h:2.5,anchor:'middle'});}}
  else if(o.kind==='ensidig'){rafters(dv,m);const [mn,mx]=ext(dv);const a=V.add(c,V.mul(dv,mn*0.35)),b=V.add(c,V.mul(dv,mx*0.35));p.line(a,b,{w:LW.thin});arrowHead(p,b,dv,2.4*u);p.text(lab,V.add(V.lerp(a,b,.5),V.mul(m,1.2*u)),{h:2.5,anchor:'middle',rot:Math.abs(o.dir%180)===90?90:0});}
  else if(o.kind==='valm'){const g=roofGeom(o);p.segs(g.lines,{w:LW.thin});p.text(g.warn?'Valm – se Egenskaber':`Valm ${lab}`,c,{h:2.5,anchor:'middle',valign:'middle',color:g.warn?'#c0392b':undefined});}
  else{p.text('Fladt tag',c,{h:2.5,anchor:'middle',valign:'middle'});}
  p.text(`Tag · spær c/c ${fmtLen(cc)}`,V.add(c,{x:0,y:4*u}),{h:2,anchor:'middle'});
}
function drawSectionMark(p,o){
  const u=p.u,d=V.norm(V.sub(o.b,o.a)),n=V.mul(V.nl(d),o.flip?-1:1);
  p.line(o.a,o.b,{w:LW.fine,dash:[8,1.5,1.5,1.5]});
  for(const [pt,sgn] of [[o.a,1],[o.b,-1]]){const q=V.add(pt,V.mul(d,sgn*6*u));p.line(pt,q,{w:LW.heavy});const tip=V.add(V.lerp(pt,q,.5),V.mul(n,4*u));p.line(V.lerp(pt,q,.5),tip,{w:LW.thin});arrowHead(p,tip,n,2*u);p.text(o.label||'A',V.add(tip,V.mul(n,3*u)),{h:4,anchor:'middle',valign:'middle',bold:true});}
}
function drawPlan(p,opt={}){

function sectionData(sec){
  const G=geo(),A=sec.a,B=sec.b,L=V.dist(A,B);if(L<10)return null;const uu=V.norm(V.sub(B,A)),par=p=>V.dot(V.sub(p,A),uu);

    for(const pc of g.pieces)for(const [p,q] of clipSeg(A,B,pc.poly)){let u0=par(p),u1=par(q);if(u0>u1)[u0,u1]=[u1,u0];if(u1-u0<1)continue;const H=wallTopAt(g,V.add(A,V.mul(uu,(u0+u1)/2)),RL);items.push({g,u0,u1,mat:pc.mat,kind:pc.kind,op:pc.op,H,z0:g.z0,tone:Ly.style==='tone',layer:Ly});}}
  const roofs=[];
  for(const r of P.objs){if(r.type!=='roof'||!LV(r.layer)||!r.pts||r.pts.length<3)continue;const zf=roofZFn(r),c=centroid(r.pts),dv={x:Math.cos(r.dir*DEG),y:-Math.sin(r.dir*DEG)};
    for(const [p,q] of clipSeg(A,B,r.pts)){const pts=[p,q];if(r.kind==='saddel'){const X=segX(p,q,V.sub(c,V.mul(dv,1e6)),V.add(c,V.mul(dv,1e6)));if(X)pts.push(X);}
      if(r.kind==='valm')for(const sg of roofGeom(r).lines){const X=segX(p,q,sg[0],sg[1]);if(X)pts.push(X);}
      pts.sort((a,b)=>par(a)-par(b));roofs.push({r,pts:pts.map(pt=>({u:par(pt),z:zf(pt)})),layer:layerById(r.layer)});}}
  const slabs=[];
  for(const o of P.objs){if(o.type!=='room'||o.cat!=='netto')continue;const rr=G.rooms.get(o.id);if(!rr)continue;const fz=floorZ(o.floor);for(const [p,q] of clipSeg(A,B,rr.poly)){let u0=par(p),u1=par(q);if(u0>u1)[u0,u1]=[u1,u0];slabs.push({u0,u1,kote:fz+(o.kote||0),low:fz<=lowestFloorZ()+1});}}
  let umin=Infinity,umax=-Infinity;for(const it of items){umin=Math.min(umin,it.u0);umax=Math.max(umax,it.u1);}for(const r of roofs)for(const pt of r.pts){umin=Math.min(umin,pt.u);umax=Math.max(umax,pt.u);}
  if(!isFinite(umin)){umin=0;umax=L;}
  let ztop=0;for(const it of items)ztop=Math.max(ztop,it.H);for(const r of roofs)for(const pt of r.pts)ztop=Math.max(ztop,pt.z+(r.r.thick||0)/Math.cos((r.r.kind==='flad'?0:r.r.pitch)*DEG));
  return{items,roofs,slabs,umin,umax,ztop,L};
}
function sectionPaint(p,sec,sd){

    else{const h=it.z0+(it.op.height||2100);p.line({x:u0,y:Y(h)},{x:u1,y:Y(h)},{w:LW.thin});}}

function roofsList(){return P.objs.filter(r=>r.type==='roof'&&LV(r.layer)&&r.pts&&r.pts.length>=3).map(r=>({r,zf:roofZFn(r),floor:r.floor||'F0',th:roofGeom(r).th}));}

function facadeData(side){

function hitTest(w,tol){const G=geo();
  for(const og of G.opens.values()){const o=og.o;if(!editable(o))continue;const rel=V.sub(w,og.g.w.a),r=V.dot(rel,og.g.u),pd=V.dot(rel,og.g.n);if(r>=og.s0-tol&&r<=og.s1+tol&&Math.abs(pd)<=og.g.t/2+tol)return o.id;

  return null;}

    case'wall':return[{p:o.a,i:'a'},{p:o.b,i:'b'}];

    case'arc':return[{p:o.c,i:'c'}];
    case'dim':{const pp=dimPts(o);if(!pp)return[];const D=dimGeom(pp[0],pp[1],o.mode,o.off);return D?[{p:V.lerp(D.D1,D.D2,.5),i:'off'}]:[];}

  const links=[];for(const w of P.objs){if(w.type!=='wall'||excludeIds.has(w.id))continue;for(const end of ['a','b'])for(const pt of pointsByWall)if(V.dist(w[end],pt.p)<1.5)links.push({id:w.id,end,orig:{...w[end]},key:pt.key});}return links;}

function translateObj(o,orig,d){
  const mv=p=>({x:p.x+d.x,y:p.y+d.y});

    case'wall':o.a=mv(orig.a);o.b=mv(orig.b);break;
    case'opening':{const g=geo().wmap.get(o.wall);if(g)o.pos=clamp(orig.pos+V.dot(d,g.u),o.width/2,g.L-o.width/2);break;}

    case'dim':for(const k of ['p1','p2'])if(orig[k].k==='pt')o[k]={k:'pt',...mv(orig[k])};break;

  }}
function setGrip(o,orig,i,p){

/* ---------- snapping ---------- */
let SG=null,SGV=-1;
function snapGeo(){if(SGV===MV)return SG;const G=geo(),pts=[],segs=[];
  const add=(p,kind,cat,pri,id,ref)=>pts.push({p,kind,cat,pri,id,ref});
  const fb=floorBelow(P.curFloor);
  for(const g of G.walls){if(!LV(g.w.layer))continue;if(!onFloor(g.w)){if(fb&&g.floor===fb.id){const l=g.offs.length-1;for(const q of [g.A[0],g.A[l],g.B[0],g.B[l]])add(q,'end','end',.2,null);}continue;}const id=g.w.id,l=g.offs.length-1;
    add(g.w.a,'end','end',0,id,{k:'we',id,end:'a'});add(g.w.b,'end','end',0,id,{k:'we',id,end:'b'});
    for(const [end,arr] of [['a',g.A],['b',g.B]])for(const side of [0,1])add(arr[side?l:0],'end','end',0,id,{k:'wc',id,end,side});
    add(V.lerp(g.w.a,g.w.b,.5),'mid','mid',.3,id);
    for(const s of g.heavy){segs.push({a:s[0],b:s[1],id});}
    segs.push({a:g.w.a,b:g.w.b,id});}
  for(const og of G.opens.values()){if(!LV(og.o.layer)||!onFloor(og.o))continue;const g=og.g,id=og.o.id;for(const e of [0,1])for(const side of [0,1])add(wpt(g,e?og.s1:og.s0,side?-g.t/2:g.t/2),'end','end',.05,id,{k:'oj',id,e,side});add(wpt(g,(og.s0+og.s1)/2,0),'mid','mid',.3,id);}
  for(const o of P.objs){if(!LV(o.layer)||!onFloor(o))continue;const id=o.id;
    const poly=(arr,closed,refable)=>{arr.forEach((p,i)=>add(p,'end','end',0,id,refable?{k:'v',id,i}:null));for(let i=0;i<arr.length-(closed?0:1);i++){const a=arr[i],b=arr[(i+1)%arr.length];segs.push({a,b,id});add(V.lerp(a,b,.5),'mid','mid',.3,id);}};
    if(o.type==='pline')poly(o.pts,o.closed,true);else if(o.type==='hatch'||o.type==='roof'||o.type==='skel')poly(o.pts,true,true);
    else if(o.type==='section')poly([o.a,o.b],false,true);
    else if(o.type==='room'){const r=G.rooms.get(id);if(r)poly(r.poly,true,o.mode!=='auto');}
    else if(o.type==='circle'){add(o.c,'center','end',.1,id,{k:'c',id});for(let k=0;k<4;k++)add({x:o.c.x+o.r*Math.cos(k*PI/2),y:o.c.y+o.r*Math.sin(k*PI/2)},'end','end',.05,id);}
    else if(o.type==='arc'){add(o.c,'center','end',.1,id,{k:'c',id});const sp=n2p(o.a1-o.a0);for(const a of [o.a0,o.a0+sp])add({x:o.c.x+o.r*Math.cos(a),y:o.c.y+o.r*Math.sin(a)},'end','end',0,id);}
    else if(o.type==='text'||o.type==='kote')add(o.p,'end','end',.1,id);
    else if(o.type==='sym')poly(symCorners(o),true,false);}
  SG={pts,segs};SGV=MV;return SG;}
function snapAt(sp,opt={}){
  const w=s2w(sp),tol=11/view.zoom,sn=PREF.snaps,from=opt.from||null,ex=opt.exclude||null;
  if(opt.raw)return{p:w,kind:'free'};
  const SGx=S.alt?{pts:[],segs:[]}:snapGeo();let best=null;

function zoomFit(){const b=drawingBBox();if(!b)return;const pad=1.15,w=Math.max(1000,b.x1-b.x0),h=Math.max(1000,b.y1-b.y0);view.zoom=Math.min(view.W/(w*pad),view.H/(h*pad));view.cx=(b.x0+b.x1)/2;view.cy=(b.y0+b.y1)/2;draw();}

/* ---------- tastatur ---------- */
window.addEventListener('keydown',e=>{
  const tg=e.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='SELECT'||tg.tagName==='TEXTAREA')){if(e.key==='Escape')tg.blur();return;}
  if(!$('#m3d').hidden){if(e.key==='Escape')close3D();return;}
  if(!$('#secModal').hidden){if(e.key==='Escape')closeSection();return;}
  const k=e.key;
  if(e.ctrlKey||e.metaKey){const l=k.toLowerCase();if(l==='z'){e.shiftKey?redo():undo();e.preventDefault();}else if(l==='c'&&S.sel.size){copySel();e.preventDefault();}else if(l==='v'){pasteStart();e.preventDefault();}else if(l==='d'&&S.sel.size){if(copySel(true))pasteStart();e.preventDefault();}else if(l==='y'){redo();e.preventDefault();}else if(l==='s'){saveFile();e.preventDefault();}return;}
  if(k==='Shift'){S.shift=true;return;}
  if(k==='Alt'){S.alt=true;e.preventDefault();if(S.mouse&&S.tool!=='select'){S.cur=snapAt(S.mouse,{from:lastPt()});draw();}return;}
  if(k===' '&&!S.textMode){S.space=true;e.preventDefault();return;}
  if(k==='PageUp'||k==='PageDown'){const fs=floorsSorted(),i=fs.findIndex(f=>f.id===P.curFloor),j=i+(k==='PageUp'?1:-1);if(fs[j])setFloor(fs[j].id);e.preventDefault();return;}
  if(k==='F8'){toggleSnap('ortho');e.preventDefault();return;}
  if(k==='F7'){toggleSnap('grid');e.preventDefault();return;}
  if(k==='F10'){toggleSnap('polar');e.preventDefault();return;}
  if(k==='Escape'){escape();return;}
  if(k==='Enter'){enter();e.preventDefault();return;}
  if(S.textMode){if(k==='Backspace'){S.input=S.input.slice(0,-1);updateCmd();e.preventDefault();}else if(k.length===1){S.input+=k;updateCmd();e.preventDefault();}return;}
  if(k==='Backspace'&&S.input){S.input=S.input.slice(0,-1);updateCmd();e.preventDefault();return;}
  if(k==='Backspace'&&S.pts.length){undoPoint();e.preventDefault();return;}
  if((k==='Delete'||k==='Backspace')&&S.sel.size){deleteSel();e.preventDefault();return;}
  if(/^[0-9.,;<@#-]$/.test(k)){S.input+=k;updateCmd();e.preventDefault();return;}
  if(S.input)return;
  const up=k.toUpperCase();
  if(up==='C'&&CHAIN.includes(S.tool)&&S.pts.length>=2){closeChain();return;}
  if(up==='F'){zoomFit();return;}
  if(up==='O'&&S.tool==='place'&&S.place){S.place.rot=(((S.place.rot||0)+(e.shiftKey?-90:90))%360+360)%360;renderPanel();draw();return;}
  if(up==='O'&&S.sel.size===1&&S.tool==='select'){const o=objById([...S.sel][0]);if(o&&o.type==='sym'){o.rot=(((o.rot||0)+(e.shiftKey?-90:90))%360+360)%360;commit();return;}}
  const d=TOOLDEFS.find(x=>x&&x.k===up);if(d)setTool(d.id);
});
window.addEventListener('keyup',e=>{if(e.key==='Alt'){S.alt=false;if(S.mouse&&S.tool!=='select'){S.cur=snapAt(S.mouse,{from:lastPt()});draw();}}if(e.key==='Shift')S.shift=false;if(e.key===' ')S.space=false;});

function toggleSnap(k){PREF.snaps[k]=!PREF.snaps[k];if(k==='ortho'&&PREF.snaps.ortho)PREF.snaps.polar=false;if(k==='polar'&&PREF.snaps.polar)PREF.snaps.ortho=false;savePref();renderSnaps();draw();}

    else if(o.type==='wall'&&f==='wt'){o.wt=v;if(v==='custom'){o.t=o.t||200;o.mat=o.mat||'mur';}}
    else if(o.type==='opening'&&(f==='dA'||f==='dB')){const og=G.opens.get(id);if(og){const L=openingLimits(og);o.pos=f==='dA'?L.lo+v+o.width/2:L.hi-v-o.width/2;}}

    else if(o.type==='opening'&&f==='kind'){o.kind=v;if(v==='window'&&!o.sill)o.sill=P.set.sill;if(v==='door')o.sill=0;}

function facadesAll(sp,s,F){const parts={};for(const k of ['S','N','O','W']){const fd=facadeData(k);if(!fd)continue;const q=new SVGPainter(EXPORT_PAL);q.u=s;const bb=facadePaint(q,fd);parts[k]={bb,o:q.o,w:bb.x1-bb.x0,h:bb.y1-bb.y0};}

const SYM3={komfur:900,ovn:900,koel:1850,fryser:1850,opvask:850,vask:900,bord:900,oe:900,toilet:420,haandvask:850,bruser:40,badekar:550,vaskemaskine:850,tumbler:850,skyllekar:850,braendeovn:1000,radiator:600,vp:700,seng2:500,seng1:500,sofa:800,laenestol:800,spisebord:750,rundbord:750,stol:900,garderobe:2100,reol:2000,skrivebord:750,tvbord:450,soejle:-1,skakt:-1};

const V3={};
function build3D(){const T=THREE,grp=new T.Group(),Sc=0.001,mats=new Map(),fl=V3.maxFloor,showRoof=V3.roof,showFurn=V3.furn;
  const fz=id=>floorZ(id),okF=id=>fz(id)<=fl+1;
  const mat=(hex,o={})=>{const k=hex+JSON.stringify(o);if(!mats.has(k))mats.set(k,new T.MeshStandardMaterial(Object.assign({color:hex,roughness:.9,metalness:0,side:T.DoubleSide},o)));return mats.get(k);};
  const P3=(p,z)=>[p.x*Sc,z*Sc,p.y*Sc];
  function prism(pts0,zb,zt,m){const pts=dedupePts(pts0);if(pts.length<3||Math.abs(polyArea(pts))<10)return;let tri;try{tri=T.ShapeUtils.triangulateShape(pts.map(q=>new T.Vector2(q.x,q.y)),[]);}catch(e){return;}
    const pos=[];for(const [a,b,c] of tri){pos.push(...P3(pts[a],zt(pts[a])),...P3(pts[b],zt(pts[b])),...P3(pts[c],zt(pts[c])),...P3(pts[a],zb(pts[a])),...P3(pts[c],zb(pts[c])),...P3(pts[b],zb(pts[b])));}
    for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length],a0=P3(a,zb(a)),a1=P3(a,zt(a)),b0=P3(b,zb(b)),b1=P3(b,zt(b));pos.push(...a0,...b0,...b1,...a0,...b1,...a1);}

  const G=geo(),RL=roofsList(),zT=P.set.terrain;let bb=null;const grow=(p,z)=>{if(!bb)bb={x0:p.x,x1:p.x,y0:p.y,y1:p.y,z0:z,z1:z};else{bb.x0=Math.min(bb.x0,p.x);bb.x1=Math.max(bb.x1,p.x);bb.y0=Math.min(bb.y0,p.y);bb.y1=Math.max(bb.y1,p.y);bb.z0=Math.min(bb.z0,z);bb.z1=Math.max(bb.z1,z);}};
  for(const g of G.walls){const Ly=layerById(g.w.layer);if(!Ly||!Ly.visible||!okF(g.floor))continue;const z0=g.floor===floorsSorted()[0].id&&g.z0<=0?Math.min(g.z0,zT):g.z0;
    const top=q=>{const sv=clamp(V.dot(V.sub(q,g.w.a),g.u),0,g.L);return wallTopAt(g,wpt(g,sv,0),RL);};
    for(const pc of g.pieces){const m=mat(Ly.style==='tone'?MAT3.tone:(MAT3[pc.mat]||MAT3.none));
      if(pc.kind==='solid'){prism(pc.poly,()=>z0,top,m);pc.poly.forEach(q=>{grow(q,z0);grow(q,top(q));});}
      else{const o=pc.op;if(o.kind==='window'){const s=g.z0+(o.sill||0),h=s+(o.height||1300);if(s>z0)prism(pc.poly,()=>z0,()=>s,m);prism(pc.poly,()=>h,q=>Math.max(h,top(q)),m);}
        else{const h=g.z0+(o.height||2100);if(z0<g.z0)prism(pc.poly,()=>z0,()=>g.z0,m);prism(pc.poly,()=>h,q=>Math.max(h,top(q)),m);}}}}
  const glass=mat(0x8fb7cf,{transparent:true,opacity:.42,roughness:.1,metalness:.2}),wood=mat(0x7b5a3c),frame=mat(0xf4f4f2);
  for(const og of G.opens.values()){const g=og.g,o=og.o,Ly=layerById(o.layer);if(!Ly||!Ly.visible||!okF(g.floor))continue;
    const zb=g.z0+(o.kind==='window'?(o.sill||0):0),zt=zb+(o.height||(o.kind==='window'?1300:2100));
    const pane=(d0,d1,s0,s1)=>[wpt(g,s0,d0),wpt(g,s1,d0),wpt(g,s1,d1),wpt(g,s0,d1)];
    prism(pane(25,-25,og.s0,og.s1),()=>zb,()=>zt,isGlazed(o)?glass:wood);
    for(const [a,b] of [[og.s0,og.s0+60],[og.s1-60,og.s1]])prism(pane(35,-35,a,b),()=>zb,()=>zt,frame);
    prism(pane(35,-35,og.s0,og.s1),()=>zt-60,()=>zt,frame);if(o.kind==='window')prism(pane(35,-35,og.s0,og.s1),()=>zb,()=>zb+60,frame);}
  for(const o of P.objs){if(o.type!=='room'||o.cat!=='netto'||!okF(o.floor))continue;const r=G.rooms.get(o.id);if(!r)continue;const z=fz(o.floor)+(o.kote||0),low=fz(o.floor)<=lowestFloorZ()+1;
    prism(r.poly,()=>z-(low?150:250),()=>z,mat(low?0xd8d2c6:0xcdb48e));}
  if(showRoof)for(const R of RL){if(!okF(R.floor))continue;const m=mat(R.r.kind==='flad'?0x5d6166:0x6e4c42);for(const prt of roofParts(R)){prism(prt.pts,q=>R.zf(q),q=>R.zf(q)+R.th,m);prt.pts.forEach(q=>grow(q,R.zf(q)+R.th));}}
  if(showFurn)for(const o of P.objs){if(o.type!=='sym'||!okF(o.floor))continue;const D=SYMS[o.k];let h=SYM3[o.k];if(h==null||!D)continue;const z=fz(o.floor);if(h<0)h=floorH(o.floor);prism(symCorners(o),()=>z,()=>z+h,mat(SYMC3[D.cat]||0xdddddd));}
  for(const o of P.objs){if(o.type!=='hatch'||!LV(o.layer)||!okF(o.floor))continue;prism(o.pts,()=>zT,()=>zT+40,mat(o.mat==='trae'?0xb08a5c:0xc9c4ba));}
  if(!bb)return null;
  const cx=(bb.x0+bb.x1)/2,cy=(bb.y0+bb.y1)/2,R=Math.max(bb.x1-bb.x0,bb.y1-bb.y0,6000);
  const gr=new T.Mesh(new T.PlaneGeometry(R*Sc*12,R*Sc*12),mat(0x9fb47e,{side:T.FrontSide}));gr.rotation.x=-Math.PI/2;gr.position.set(cx*Sc,zT*Sc-0.002,cy*Sc);gr.receiveShadow=true;grp.add(gr);
  for(const o of P.objs){if(o.type!=='skel'||!o.pts||o.pts.length<3)continue;const pts=o.pts.concat([o.pts[0]]).map(q=>new T.Vector3(q.x*Sc,zT*Sc+0.01,q.y*Sc));grp.add(new T.Line(new T.BufferGeometry().setFromPoints(pts),new T.LineDashedMaterial({color:0x7a2f2f,dashSize:.6,gapSize:.25})).computeLineDistances());}
  return{grp,c:{x:cx*Sc,y:((bb.z0+bb.z1)/2)*Sc,z:cy*Sc},R:R*Sc,bb};}
function g3fill(){const sel=$('#g3floor'),fs=floorsSorted();sel.innerHTML=fs.slice().reverse().map(f=>`<option value="${f.z}"${f.z===V3.maxFloor?' selected':''}>${fs.length>1?'Til og med '+esc(f.name):'Alle'}</option>`).join('');}
function g3rebuild(){const T=THREE;if(V3.model){V3.scene.remove(V3.model.grp);V3.model.grp.traverse(o=>{if(o.geometry)o.geometry.dispose();});}
  V3.model=build3D();const msg=$('#g3msg');if(!V3.model){msg.hidden=false;msg.textContent='Der er intet at vise endnu. Tegn vægge først.';return;}msg.hidden=true;V3.scene.add(V3.model.grp);g3sun();}
function g3sun(){if(!V3.model)return;const a=V3.sun*DEG,el=40*DEG,R=V3.model.R*1.6,c=V3.model.c,L=V3.light;
  L.position.set(c.x+Math.sin(a)*Math.cos(el)*R,c.y+Math.sin(el)*R,c.z+Math.cos(a)*Math.cos(el)*R);L.target.position.set(c.x,c.y,c.z);L.target.updateMatrixWorld();
  const sc=L.shadow.camera,e=V3.model.R*1.2;sc.left=-e;sc.right=e;sc.top=e;sc.bottom=-e;sc.near=.1;sc.far=R*4;sc.updateProjectionMatrix();}
function g3cam(){const c=V3.model?V3.model.c:{x:0,y:0,z:0},o=V3.orb,t=o.t;const x=t.x+o.r*Math.sin(o.ph)*Math.sin(o.th),y=t.y+o.r*Math.cos(o.ph),z=t.z+o.r*Math.sin(o.ph)*Math.cos(o.th);V3.cam.position.set(x,y,z);V3.cam.lookAt(t.x,t.y,t.z);}
function g3preset(v){if(!V3.model)return;const c=V3.model.c,R=V3.model.R,o=V3.orb;o.t={...c};
  const P_={iso:[-35,58,1.9],S:[0,82,1.7],N:[180,82,1.7],O:[90,82,1.7],W:[-90,82,1.7]}[v]||[-35,58,1.9];o.th=P_[0]*DEG;o.ph=P_[1]*DEG;o.r=R*P_[2];g3cam();}
async function open3D(){$('#m3d').hidden=false;const msg=$('#g3msg');msg.hidden=false;msg.textContent='Indlæser 3D …';
  try{await ensureThree();}catch(e){msg.textContent='3D kræver internet første gang (henter 3D-modulet). Prøv igen, når du er online.';return;}
  const T=THREE,wrap=$('#g3wrap');
  if(!V3.renderer){V3.renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});V3.renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));V3.renderer.shadowMap.enabled=true;V3.renderer.shadowMap.type=T.PCFSoftShadowMap;
    if(T.sRGBEncoding)V3.renderer.outputEncoding=T.sRGBEncoding;wrap.appendChild(V3.renderer.domElement);
    V3.scene=new T.Scene();V3.scene.background=new T.Color(0xe4ecf3);V3.scene.fog=new T.Fog(0xe4ecf3,80,260);
    V3.scene.add(new T.HemisphereLight(0xf2f6ff,0x8a8f7a,.75));const L=new T.DirectionalLight(0xfff4e2,.95);L.castShadow=true;L.shadow.mapSize.set(2048,2048);L.shadow.bias=-0.0005;V3.scene.add(L);V3.scene.add(L.target);V3.light=L;
    V3.cam=new T.PerspectiveCamera(42,1,.05,2000);V3.orb={th:0,ph:1,r:30,t:{x:0,y:0,z:0}};V3.sun=200;V3.roof=true;V3.furn=true;

    el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);pt.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pt.size===2){const [a,b]=[...pt.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),r:V3.orb.r};drag=null;return;}
      drag={x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey,th:V3.orb.th,ph:V3.orb.ph,t:{...V3.orb.t}};el.style.cursor='grabbing';});

function g3size(){if(!V3.renderer)return;const w=$('#g3wrap'),W=w.clientWidth||800,H=w.clientHeight||500;V3.renderer.setSize(W,H,false);V3.renderer.domElement.style.width='100%';V3.renderer.domElement.style.height='100%';V3.cam.aspect=W/H;V3.cam.updateProjectionMatrix();}

function g3png(){if(!V3.renderer)return;V3.renderer.render(V3.scene,V3.cam);V3.renderer.domElement.toBlob(b=>{if(b){download(`${fileBase()}-3d.png`,b);toast('Billedet er gemt.');}});}

function download(name,data,type){const blob=data instanceof Blob?data:new Blob([data],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);}
const fileBase=()=>(P.meta.projekt||'tilbygning').replace(/[^\wæøåÆØÅ -]+/g,'').trim().replace(/\s+/g,'-').toLowerCase()||'tilbygning';
function saveFile(){download(fileBase()+'.tilbyg.json',JSON.stringify(P),'application/json');toast('Projektet er gemt som fil.');}
$('#fOpen').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const p=JSON.parse(await f.text());if(p.app!=='tilbygning-cad')throw new Error('format');p.imgs=p.imgs||{};P=migrate(p);S.sel.clear();commit();syncHeader();zoomFit();toast(`Åbnede "${P.meta.projekt}".`);}catch(err){toast('Filen kunne ikke åbnes – vælg en .tilbyg.json-fil gemt fra programmet.');}});
function exportSVG(kind,arg){const r=buildSheet(kind,arg);if(!r)return toast('Der er intet at eksportere.');download(`${fileBase()}-${viewFileName(kind,arg)}-1-${r.s}.svg`,r.svg,'image/svg+xml');
  const warn=kind==='plan'?(sheetState().ok?'':sheetMsg(sheetState())):fitMsg(r);toast(`SVG gemt i 1:${r.s} på ${P.set.paper}.`+(warn?' Bemærk: '+warn:''));}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error(src));document.head.appendChild(s);});}
async function ensurePDF(){if(!window.jspdf)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');if(!window.jspdf.jsPDF.API.svg&&!window.svg2pdf)await loadScript('https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.3/dist/svg2pdf.umd.min.js');}
async function exportPDF(kind,arg){
  const r=buildSheet(kind,arg);if(!r)return toast('Der er intet at eksportere.');const svg=r.svg;toast('Laver PDF …');
  try{await ensurePDF();const {W,H}=paperDims();const doc=new window.jspdf.jsPDF({orientation:W>H?'landscape':'portrait',unit:'mm',format:P.set.paper.toLowerCase(),compress:true});
    const holder=document.createElement('div');holder.style.cssText='position:fixed;left:-10000px;top:0;width:10px;height:10px;overflow:hidden';holder.innerHTML=svg;document.body.appendChild(holder);const el=holder.querySelector('svg');
    if(doc.svg)await doc.svg(el,{x:0,y:0,width:W,height:H});else if(window.svg2pdf&&window.svg2pdf.svg2pdf)await window.svg2pdf.svg2pdf(el,doc,{x:0,y:0,width:W,height:H});else await window.svg2pdf(el,doc,{x:0,y:0,width:W,height:H});
    holder.remove();doc.setProperties({title:`${P.meta.projekt} – ${r.tegning}`,creator:'Tilbygning CAD'});
    doc.save(`${fileBase()}-${viewFileName(kind,arg)}-${P.set.paper}-1-${r.s}.pdf`);const warn=kind==='plan'?(sheetState().ok?'':sheetMsg(sheetState())):fitMsg(r);toast(warn?`PDF gemt. Bemærk: ${warn}`:`PDF gemt: ${P.set.paper} i 1:${r.s}. Udskriv med "Faktisk størrelse" for at bevare målestokken.`);}

const IMGC=new Map();

$('#fUnder').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
